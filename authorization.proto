syntax = "proto3";

package wendycloud.v1;

import "google/protobuf/timestamp.proto";

// Cloud authorization contracts for the cloud <-> pki-core two-key model (AAA W9 / W15 / W18).
// These are the surfaces Cloud PRODUCES or SERVES:
//   - W9  CloudAuthorizationGrant        : the grant Cloud signs and relays for entitlement issuance
//   - W15 RightsAttestationService       : Cloud-served RPC pki-core calls to check rights at signing time
//   - W18 EnrollmentTokenRevocation      : Cloud-emitted revoke-only signal for a pending enrollment token
//   - W18 OperatorEnrollmentRequest      : operator-signed enrollment request Cloud relays to pki-core
//
// ===========================================================================
// READ THIS FIRST: two kinds of message live in this file
// ===========================================================================
// This file mixes GENERATED code with DOCUMENTATION, deliberately:
//
//   1. RightsAttestationService (+ its request/response messages) is a REAL, code-generated gRPC
//      service. Cloud is the server, pki-core the client. Normal proto rules apply: the generated
//      types ARE the wire format.
//
//   2. CloudAuthorizationGrant, EnrollmentTokenRevocation, and OperatorEnrollmentRequest are
//      DOCUMENTARY SCHEMA ONLY. They are NOT serialized as protobuf anywhere. Each describes a
//      flat JSON claim set that is signed as a JWS (compact serialization) and carried as opaque
//      bytes in `wendyauth.v1.SignedArtifact.value`. pki-core's verifiers `json.Unmarshal` that
//      JWS payload; they never parse a serialized proto.
//
//      For those three messages: the FIELD NAMES AND ENCODINGS IN THE COMMENTS ARE THE WIRE.
//      Do NOT rely on proto3-JSON mapping to produce them -- proto3 JSON would emit lowerCamelCase
//      (`csrKeyBinding`) and RFC-3339 strings for timestamps, and pki-core accepts neither. The
//      JSON is snake_case with Unix-epoch-seconds integers, which is why the documentary messages
//      below use `int64` for times rather than google.protobuf.Timestamp (only the real W15 RPC
//      uses Timestamp).
//
// Wrapper placement (was the draft's open question, now SETTLED): these payloads travel as opaque
// `SignedArtifact.value` bytes. This file does NOT import `wendyauth.v1` and does not need to --
// the wrapper types (`Envelope`, `SignedArtifact{kind,value}`, `SecurityEventService.PushSecurityEvent`)
// stay owned by wendy-auth, and nothing here compile-time-depends on them. This matches the
// verifiers pki-core has already shipped (`internal/grant`, `internal/ssf`, `internal/changereq`).
//
// ===========================================================================
// Cloud's signing identity (one key, one JWKS, per-purpose audience)
// ===========================================================================
// Cloud signs BOTH the W9 grant and the W18 revoke SET with the SAME Cloud-KMS asymmetric key,
// gated by Cloud's GCP workload identity. Not the WI OIDC token (Google-controlled, carries no
// embeddable grant); not a pki-core cert (Cloud holds none); never RSA (pki-core's envelope parser
// admits only ES256/ES384 and ML-DSA-44/65/87).
//
//   issuer ("iss")   : "https://cloud.wendy.sh"                        -- ONE bare issuer, both purposes
//   JWKS             : "https://cloud.wendy.sh/.well-known/jwks.json"  -- ONE endpoint, rotating, never pinned
//   audience ("aud") : per purpose, and this is what separates them:
//                        grants       -> "https://pki.wendy.sh/grant"
//                        revoke SETs  -> "https://pki.wendy.sh/fabric/token-revoke"
//
// A `kid` in the JWS protected header is MANDATORY on every artifact Cloud signs. pki-core resolves
// the verification key by kid alone; there is NO "try every key in the keyset" fallback for
// cloud-origin artifacts. Across a rotation: publish the new key in the JWKS BEFORE signing with
// it, and keep the old key published until every artifact signed with it has expired.
//
// SignedArtifact.kind strings (the full set this file defines):
//   "cloud-grant+jws"              -> CloudAuthorizationGrant      (W9)
//   "enrollment-request+jws"       -> OperatorEnrollmentRequest    (W18 relay)
//   "enrollment-token-revoke+jws"  -> the revoke SET               (W18)

// ---------------------------------------------------------------------------
// W9 -- entitlement-bearing certificate issuance: the Cloud authorization grant
// ---------------------------------------------------------------------------
// DOCUMENTARY SCHEMA (see "READ THIS FIRST" above): this describes the JSON claim set of the JWS
// payload carried in SignedArtifact{kind:"cloud-grant+jws", value:<compact JWS bytes>}. The field
// names and encodings below are the JSON wire.
//
// Cloud's attestation that it verified the caller and authorized the named entitlements for the
// named tenant. Two-key model: the OPERATOR signs the request (pki-core verifies that signature
// independently, D7); CLOUD signs THIS grant. pki-core mints an entitlement cert only when both
// verify, bounded by entitlements subset-of tenant ceiling subset-of platform cap (no-expansion).
// Operator identity is NOT a field here: it is established by the operator signature pki-core
// verifies independently.
//
// REGISTERED JWT CLAIMS -- present on the JSON wire, required by pki-core, NOT modelled as fields
// below (they belong to the JWS/JWT layer, not to Cloud's payload vocabulary):
//
//   "iss"  string  REQUIRED  "https://cloud.wendy.sh". Must match a configured pki-core issuer, and
//                            must equal the issuer pki-core read (untrusted) to select the key.
//   "aud"  string  REQUIRED  "https://pki.wendy.sh/grant", compared for exact equality (a single
//                            string, not an array, on this artifact).
//   "iat"  int64   REQUIRED  Unix epoch seconds. A missing/zero iat is rejected. Tolerates a small
//                            skew, and ONLY in the direction of a receiver clock trailing Cloud.
//   "exp"  int64   REQUIRED  Unix epoch seconds -- this is the grant's `not_after` (see the field
//                            below; it appears on the wire as "exp", not as "not_after").
//
// exp IS ENFORCED STRICTLY, WITH ZERO GRACE. A grant one second past its own exp is rejected: no
// clock-drift tolerance, no network-latency allowance. Size the exp lead time to cover minting ->
// relay -> verification including realistic queueing and retry on Cloud's side; pki-core will not
// extend it after the fact.
message CloudAuthorizationGrant {
  // JSON "principal". Tenant SPIFFE URI of the principal the entitlements are granted to:
  // spiffe://wendy.sh/tenant/<uuid>/<kind>/<name>. pki-core derives the TENANT from this URI --
  // there is no separate tenant field on a grant.
  string principal = 1;

  // JSON "entitlements": array of strings. REQUIRED, may be empty.
  // Entitlement-grammar strings (Cloud-defined vocabulary): entitlement:{category}:{permission}:{effect},
  // categories organization|asset|app|deployment|member|team, permissions read|create|write|owner,
  // effect allow|deny (deny-wins), `*` wildcard, 512-byte budget. Every entry must be coverable by
  // pki-core's own view of the tenant ceiling, itself bounded by the platform cap, or the whole
  // grant is rejected (no-expansion).
  repeated string entitlements = 2;

  // JSON "csr_key_binding": a base64url STRING, no padding, of SHA-256(CSR public key SPKI DER) --
  // exactly 32 bytes decoded. NOT a proto `bytes` field and NOT standard-base64: pki-core decodes
  // it with base64url-no-padding and rejects anything that is not 32 bytes, then compares it
  // byte-for-byte against the thumbprint of the CSR it is about to mint against. Cloud must compute
  // this over the same CSR the operator is about to submit, so the grant cannot be repointed onto a
  // different key.
  string csr_key_binding = 3;

  // JSON "exp": int64 Unix epoch SECONDS (NOT an RFC-3339 string, NOT a nested Timestamp object).
  // Grant validity, kept short. See the strict-expiry note in this message's leading comment.
  int64 not_after = 4;

  // JSON "jti". REQUIRED, fresh and globally unique per grant. pki-core keeps a replay cache keyed
  // on this until the grant's exp; presenting a jti twice is rejected as a replay even when the
  // rest of the grant is perfectly valid.
  string jti = 5;

  // JSON "scope": array of strings, OPTIONAL. Deliberate attenuation -- a scope narrower than the
  // principal's full authority. A narrower `entitlements` set already expresses attenuation; this
  // carries any additional scoping the two teams decide to express explicitly. Carried through
  // uninterpreted by pki-core today.
  //
  // NOTE (cross-repo delta): pki-core's shipped `grant.Claims.Scope` is currently a single JSON
  // string. It is being widened to a string ARRAY to match this field. Cloud must emit an array.
  repeated string scope = 6;
}

// ---------------------------------------------------------------------------
// W15 -- device-facing verification: rights at signing time
// ---------------------------------------------------------------------------
// A REAL generated gRPC service (unlike the documentary messages in this file). Cloud is the
// SERVER; pki-core is the client. When a device asks pki-core to verify a queued operator-signed
// change request, pki-core verifies the operator signature + cert-validity-at-signing (against its
// RFC 3161 TSA timestamp), then calls this to confirm the operator's rights AT THAT TIME.
//
// Cloud answers from the tamper-evident accounting record of the accept-gate decision it made when
// it accepted and queued that exact request (keyed by request_descriptor_hash) -- a point-in-time
// answer by RECORDED DECISION, not a reconstruction of historical roles.
service RightsAttestationService {
  rpc AttestRightsAtSigningTime(RightsAttestationRequest) returns (RightsAttestationResponse);
}

message RightsAttestationRequest {
  // Tenant SPIFFE URI of the operator who signed the request. Resolved by pki-core from the
  // verified x5c certificate chain's tenant SAN -- NOT read from any claim inside the request
  // descriptor itself.
  string operator_principal = 1;

  // SHA-256 of the canonical request descriptor the operator signed: 32 RAW bytes (this is a real
  // proto `bytes` field on a real RPC, so it is NOT base64-encoded at this layer).
  //
  // ===================== THE PREIMAGE, EXACTLY =====================
  // preimage = the DECODED INNER JWS PAYLOAD of the operator's signed request.
  //
  // That is: take the operator's request as a 3-segment JWS Compact Serialization
  // (header "." payload "." signature), base64url-DECODE the middle segment, and hash THOSE bytes.
  //
  //   request_descriptor_hash = SHA-256( base64url_decode( jws_payload_segment ) )
  //
  // NOT the full 3-segment compact-JWS string. NOT the still-base64url-encoded payload segment.
  // NOT a re-serialization, re-indentation, or key-reordering of the decoded JSON -- hash the
  // decoded bytes exactly as they arrived, byte-for-byte. There is no canonical-JSON step: the
  // operator's own signature already fixes those bytes, so both sides hash the identical octets
  // with no normalization on either side.
  //
  // Cloud must therefore record this hash over the same decoded-payload bytes when it accepts and
  // queues the request, or its audit lookup will simply miss and every attestation will fail closed.
  //
  // This is a DIFFERENT byte range from the RFC 3161 timestamp binding, which is over the ENTIRE
  // signed-request JWS bytes. The two hash different things on purpose: the descriptor hash says
  // WHAT was requested; the timestamp imprint says WHEN the signed request existed. Do not
  // conflate them.
  //
  // (pki-core carries this value internally as a base64url-no-padding string and decodes it to
  // these 32 raw bytes for the RPC; that encoding is an implementation detail on its side, not
  // part of this wire contract.)
  bytes request_descriptor_hash = 2;

  // The signing time T -- the trusted RFC 3161 genTime pki-core recovered from the TSA token, i.e.
  // a point in the PAST, never wall-clock "now" at query time. Asking about the past is the entire
  // point of the two-signature (operator + TSA) design.
  google.protobuf.Timestamp signing_time = 3;
}

message RightsAttestationResponse {
  // Fail-closed: false when Cloud has no recorded accept-gate decision for this request. A request
  // Cloud never accepted cannot be attested.
  //
  // ============ "WE SAY NO" AND "WE DON'T KNOW" ARE DIFFERENT ANSWERS ============
  // pki-core treats these two outcomes as materially different, and they are NOT interchangeable:
  //
  //   OK status + authorized=false  -> an explicit, authoritative DENIAL. pki-core records the
  //                                   request as verified-but-not-authorized.
  //   any non-OK gRPC status        -> "UNKNOWN, not denied". pki-core treats EVERY RPC error
  //                                   uniformly as a transport failure and falls back to offline
  //                                   mode (valid=true, authorized=false, offline=true) rather
  //                                   than failing the request outright.
  //
  // So if Cloud cannot determine an answer (no record of the operator, an internal dependency
  // down), it must CHOOSE deliberately which of the two it means. Returning OK+false for "our
  // database is unreachable" tells pki-core a lie it will act on; returning an error for "this
  // operator genuinely had no such right" throws away a real denial.
  bool authorized = 1;

  // When Cloud recorded the accept-gate decision (should bracket `signing_time`).
  google.protobuf.Timestamp decision_time = 2;

  // The entitlement(s) the accept-gate enforced for this request (Cloud-defined grammar, same
  // vocabulary as CloudAuthorizationGrant.entitlements).
  repeated string required_entitlements = 3;

  // Cross-service trace id stitching this flow through the audit chains.
  string correlation_id = 4;
}

// ---------------------------------------------------------------------------
// W18 -- enrollment-token revocation (revoke-only signal)
// ---------------------------------------------------------------------------
// DOCUMENTARY SCHEMA (see "READ THIS FIRST" above). Cloud-emitted, revoke-only event to kill a
// still-pending (unredeemed) enrollment token at pki-core. Cloud holds no enrollment bookkeeping of
// its own: an enrollment is a not-yet-redeemed credential pki-core already tracks, so cancellation
// is a revoke of that token, not a Cloud-side flag.
//
// ===========================================================================
// EMBEDDING: a Cloud-KMS-signed SET on the existing PushSecurityEvent channel
// ===========================================================================
// The revoke is NOT a bare payload. It is an RFC 8417 Security Event Token -- a compact JWS signed
// by Cloud's own KMS key -- pushed over the SAME
// `wendyauth.v1.SecurityEventService.PushSecurityEvent` RPC wendy-auth already uses for RISC
// account-disable/purge events. There is no separate RPC or service to stand up. pki-core
// re-verifies the SET itself (D7, "never trust the relay"): transport authentication of the push
// grants no authority whatsoever.
//
// The two event families share that transport but are NEVER trust-conflated: Cloud signs with its
// own KMS key, verified against Cloud's JWKS, completely independent of any wendy-auth realm JWKS.
// A realm key must never attest a token revocation, and Cloud's key must never attest a RISC
// account event.
//
//   Envelope {
//     msg_type:        "ssf.security_event"        // same constant as the RISC path
//     tenant:          "<tenant UUID>"             // OPTIONAL cross-check hint only (see below)
//     correlation_id:  "<trace id>"                // REQUIRED; an empty value is rejected before
//                                                  // the SET is even looked at
//     signed_artifact: SignedArtifact {
//       kind:  "enrollment-token-revoke+jws"       // FINAL (was the placeholder "token-revoke+jwt")
//       value: <compact JWS bytes -- the SET itself>
//     }
//   }
//
// `tenant` on the Envelope is a cross-check HINT, never a source of truth: if non-empty it must
// equal the SET-verified tenant or the push is hard-rejected; empty skips the check.
//
// The SET carries the standard registered claims -- "iss" ("https://cloud.wendy.sh"), "aud"
// ("https://pki.wendy.sh/fabric/token-revoke", accepted as either a string or an array),
// "iat"/"exp" (int64 epoch seconds, small skew tolerated on both edges here), "jti" (REQUIRED,
// used for idempotency) -- plus an "events" map holding exactly this event type:
//
//   "https://schemas.wendy.sh/secevent/enrollment-token-revoke"
//
// whose detail object is the JSON below. NOTE the detail object's field names intentionally differ
// from this message's proto field names (see the oneof mapping):
//
//   {
//     "iss": "https://cloud.wendy.sh",
//     "aud": "https://pki.wendy.sh/fabric/token-revoke",
//     "iat": 1784659200,
//     "exp": 1784659500,
//     "jti": "8f0e6b2e-1e2b-4b9a-9b1e-6a5f9c9d9e00",
//     "events": {
//       "https://schemas.wendy.sh/secevent/enrollment-token-revoke": {
//         "token_kind": "eab",
//         "token_ref":  "<opaque token/key reference>",
//         "tenant":     "2558fd76-afc7-466e-9613-6b715296a526",
//         "device_id":  "optional-device-identifier",
//         "reason":     "device lost before install"
//       }
//     }
//   }
//
// There is NO `sub_id` on this event type, and Cloud must not invent one. The RISC path derives
// tenant from `sub_id`'s SPIFFE principal URI because those events are fundamentally ABOUT a
// principal; a token revocation is about a TOKEN, which has no SPIFFE identity of its own -- so
// tenant travels as an explicit bare-UUID claim on the detail object instead.
//
// An authentic SET whose detail is malformed is a HARD ERROR, not a silent skip: pki-core will not
// acknowledge-and-drop a revoke it could not parse (fail-safe direction -- this channel only ever
// removes authority).
message EnrollmentTokenRevocation {
  // Identifies the pending credential to revoke; which arm is set depends on device class.
  //
  // MAPPING TO THE DETAIL OBJECT: this oneof does NOT appear as a oneof on the JSON wire. It
  // flattens into the detail object's ("token_kind", "token_ref") pair, where token_kind is an
  // exact enum string pki-core rejects any other value for -- even when the SET verifies cleanly:
  //
  //   eab_key_id  -> {"token_kind": "eab",       "token_ref": "<the ACME EAB key id>"}
  //   token_id    -> {"token_kind": "bootstrap", "token_ref": "<the EST bootstrap token id>"}
  //
  // token_ref is OPAQUE to pki-core: it is stored and compared exactly, never interpreted or
  // parsed. Neither arm being set is invalid -- a revoke that names no credential is rejected.
  oneof credential {
    string eab_key_id = 1;   // Class A/B: the ACME External Account Binding key id
    string token_id = 2;     // Class C: the EST bootstrap token id
  }

  // JSON "tenant": a bare tenant UUID string on the detail object (see the no-`sub_id` note above).
  string tenant = 3;

  // JSON "device_id", OPTIONAL. The device the token was bound to (tokens are single-use and bound
  // to {device_id, tenant}).
  string device_id = 4;

  // JSON "reason", OPTIONAL. Free-form audit reason (device lost/stolen before install, operator
  // cancelled, tenant suspended). Recorded by pki-core for audit; never interpreted as policy --
  // no reason string changes what the revoke does.
  string reason = 5;
}

// ---------------------------------------------------------------------------
// W18 -- operator-signed enrollment request (relayed by Cloud)
// ---------------------------------------------------------------------------
// DOCUMENTARY SCHEMA (see "READ THIS FIRST" above): the JSON claim set of the JWS payload carried
// in SignedArtifact{kind:"enrollment-request+jws", value:<compact JWS bytes>}.
//
// The operator-signed enrollment request Cloud relays over the fabric to pki-core, which then mints
// a device+tenant-bound single-use token (ACME EAB key for Class A/B, EST bootstrap token for
// Class C). Content is operator-produced; Cloud authorizes (on the operator's permissions), records
// nothing long-lived, and relays.
//
// SIGNER: unlike the W9 grant and the W18 revoke SET, this artifact is signed by the OPERATOR, not
// by Cloud's KMS key. pki-core verifies the operator signature independently against the operator's
// certificate chain -- Cloud relaying it confers no authority (D7).
//
// Registered claims on the JSON wire follow the same conventions as CloudAuthorizationGrant ("iss",
// "aud"), plus this message's own iat/exp/jti fields below -- which for this artifact ARE the
// registered claims, spelled out as fields because they carry the request's freshness semantics.
//
// STATUS -- NOT YET EXERCISED: pki-core has no verifier for this artifact today. Enrollment-token
// MINTING over the fabric is deferred work, so unlike the grant and revoke schemas (both backed by
// shipped, tested verifiers), this shape has never been parsed by anything. Treat it as the agreed
// TARGET shape, and expect field-level details to be re-confirmed when pki-core builds the minting
// path against it.
message OperatorEnrollmentRequest {
  // JSON "tenant": bare tenant UUID string.
  string tenant = 1;

  // JSON "device_id".
  string device_id = 2;

  // JSON "device_class": the ENUM'S NAME as a string, e.g. "DEVICE_CLASS_A" (not the integer).
  DeviceClass device_class = 3;

  // JSON "csr_key_binding": base64url STRING, no padding, of SHA-256(device public key SPKI DER) --
  // same encoding as CloudAuthorizationGrant.csr_key_binding, and for the same reason (this is a
  // JSON claim set, not proto3-JSON). For Class A/B: thumbprint of the device-generated key; the
  // key itself never leaves the device.
  string csr_key_binding = 4;

  // JSON "attestation_ref": base64url STRING, no padding, OPTIONAL. For Class A, a reference
  // proving the key lives in hardware. Required for Class A, absent otherwise.
  string attestation_ref = 5;

  // JSON "iat": int64 Unix epoch SECONDS (not RFC-3339). Issued-at, for freshness.
  int64 iat = 6;

  // JSON "exp": int64 Unix epoch SECONDS (not RFC-3339). Request expiry, for freshness.
  int64 exp = 7;

  // JSON "jti": replay id, fresh and globally unique per request.
  string jti = 8;
}

// Device capability/trust + (re)enrollment class (AAA section 5.4). Orthogonal to deployment
// (field_mode) and provisioning method.
//
// ===========================================================================
// RELATIONSHIP TO pki-core's TIER MODEL: 1:1 BY LETTER, DIFFERENT MEANING
// ===========================================================================
// pki-core has its own A/B/C notion -- the device TIER, parsed from a certificate profile name
// (`internal/ca/profileregistry.Tier`, returning the LOWERCASE letter "a"/"b"/"c" from profile
// names of the form `device-tier-{a,b,c}`). The letters correspond exactly:
//
//   DEVICE_CLASS_A  <->  profile "device-tier-a"  (tier "a")
//   DEVICE_CLASS_B  <->  profile "device-tier-b"  (tier "b")
//   DEVICE_CLASS_C  <->  profile "device-tier-c"  (tier "c")
//
// But they are a MAPPING between two different concerns, not one shared concept, and neither side
// should assume the other's semantics:
//
//   Cloud's DeviceClass -- what enrollment method to use, and whether attestation is required.
//   pki-core's tier     -- which crypto policy and maximum certificate validity apply
//                          (per-tier `crypto_policy.defaults.tiers` + per-tier validity ceilings).
//
// So a class does not itself grant a validity or an algorithm, and a tier does not itself decide an
// enrollment method. Cloud names the class; pki-core independently resolves the tier's policy.
enum DeviceClass {
  DEVICE_CLASS_UNSPECIFIED = 0;
  DEVICE_CLASS_A = 1;  // hardware attestation (TPM/SE); enrolls over ACME, attestation required
  DEVICE_CLASS_B = 2;  // held key, no/weak attestation; enrolls over ACME
  DEVICE_CLASS_C = 3;  // constrained; enrolls over lightweight EST/CSR
}
