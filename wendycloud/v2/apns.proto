syntax = "proto3";

package wendycloud.v2;

import "wendy/options.proto";
import "wendycloud/v2/signed_request.proto";

service APNSService {
  // Signed; payload_type "wendycloud.v2.APNSRegisterDeviceTokenRequest".
  rpc RegisterDeviceToken(SignedRequest) returns (APNSRegisterDeviceTokenResponse) {
    option (wendy.signed_request) = true;
  }
  // Signed; payload_type "wendycloud.v2.APNSUnregisterDeviceTokenRequest".
  rpc UnregisterDeviceToken(SignedRequest) returns (APNSUnregisterDeviceTokenResponse) {
    option (wendy.signed_request) = true;
  }
}

enum APNSEnvironment {
  APNS_ENVIRONMENT_UNSPECIFIED = 0;
  APNS_ENVIRONMENT_DEVELOPMENT = 1;
  APNS_ENVIRONMENT_PRODUCTION = 2;
}

message APNSRegisterDeviceTokenRequest {
  bytes device_token = 1;
  APNSEnvironment environment = 2;
  string topic = 3;
}

message APNSRegisterDeviceTokenResponse {
  bool success = 1;
}

message APNSUnregisterDeviceTokenRequest {
  bytes device_token = 1;
  APNSEnvironment environment = 2;
  string topic = 3;
}

message APNSUnregisterDeviceTokenResponse {
  bool success = 1;
}
