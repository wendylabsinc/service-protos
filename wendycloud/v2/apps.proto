syntax = "proto3";

package wendycloud.v2;

import "google/protobuf/timestamp.proto";
import "wendy/options.proto";
import "wendycloud/v2/signed_request.proto";

service AppService {
  // Signed; payload_type "wendycloud.v2.UpsertAppRequest".
  rpc UpsertApp(SignedRequest) returns (App) {
    option (wendy.signed_request) = true;
  }
  rpc GetApp(GetAppRequest) returns (App);
  // Signed; payload_type "wendycloud.v2.UpdateAppRequest".
  rpc UpdateApp(SignedRequest) returns (App) {
    option (wendy.signed_request) = true;
  }
  // Signed; payload_type "wendycloud.v2.DeleteAppRequest".
  rpc DeleteApp(SignedRequest) returns (DeleteAppResponse) {
    option (wendy.signed_request) = true;
  }
  rpc ListApps(ListAppsRequest) returns (ListAppsResponse);
}

message App {
  string id = 1;
  string organization_id = 2;
  string name = 3;
  string details = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
  // Interim owner/admin-controlled grant allowing this app to send notifications.
  // WDY-2058 will replace this with capability-scoped app authorization.
  bool can_send_notifications = 7;
}

message UpsertAppRequest {
  string id = 1;
  string organization_id = 2;
  optional string name = 3;
  optional string details = 4;
}

message GetAppRequest {
  string id = 1;
  string organization_id = 2;
}

message UpdateAppRequest {
  string id = 1;
  string organization_id = 2;
  optional string name = 3;
  optional string details = 4;
  // Interim owner/admin-controlled grant allowing this app to send notifications.
  // WDY-2058 will replace this with capability-scoped app authorization.
  optional bool can_send_notifications = 5;
}

message DeleteAppRequest {
  string id = 1;
  string organization_id = 2;
  // Operator-signed UnassignDeviceRequests, one per device that still holds
  // a deployment of the app. Each is a TERMINAL removal: it carries the
  // maximum revision, 2147483647 (UnassignDeviceRequest.revision).
  // - Each passes the full request-signing gate as an UnassignDevice call
  //   would: the `operation` claim of DeploymentService.UnassignDevice or its
  //   deprecated ArtifactRegistryService twin, the deployment's resource
  //   binding, `x5c` only, its own nonce claimed, iat/expiry checked at
  //   receipt. It must name a deployment of the app being deleted.
  // - DeleteApp may be repeated with batches (clients send about 200 per
  //   call; the whole request stays under the server's message limit). Each
  //   call's removals are verified, queued and relayed verbatim.
  // - From the first accepted call until the delete completes, cloud refuses
  //   any change to the app's deployments.
  // - The call after which no device lacks a removal deletes the app, its
  //   releases and its deployments, without waiting for the devices. Until
  //   then each call ends with FAILED_PRECONDITION saying how many devices
  //   still need one.
  repeated SignedRequest device_removals = 3;
}

message DeleteAppResponse {
  bool success = 1;
}

message ListAppsRequest {
  string organization_id = 1;
  // Offset/limit based pagination (offset = starting row, limit = page size)
  optional int32 offset = 2;
  optional int32 limit = 3;
  optional string filter = 4;  // Filter by name or details
}

message ListAppsResponse {
  repeated App apps = 1;
  int32 total = 2;
}
