syntax = "proto3";

package wendycloud.v2;

import "google/protobuf/timestamp.proto";
import "wendy/options.proto";
import "wendycloud/v2/roles.proto";
import "wendycloud/v2/signed_request.proto";

// Access bindings (WDY-4052). A binding is principal × role × scope × effect:
// it gives a principal (user, group or device) a role at a scope (the
// organization, a site, a tag or one device), as allow or deny.
//
// Resolution: every allow binding whose scope covers the resource, minus every
// deny binding that covers it. A principal holding several roles gets their
// union. Roles only allow; deny exists only on bindings. Non-device
// permissions count only from organization-scope bindings. The tenant ceiling
// and the platform cap still apply: a binding never grants past them.
//
// Invariants, refused with INVALID_ARGUMENT unless stated otherwise:
// 1. The role is built-in or a role of the same organization (else NOT_FOUND).
// 2. An organization-kind role (RoleKind) binds only at ORGANIZATION scope.
// 3. Owner binds only a USER principal, with effect ALLOW, at ORGANIZATION
//    scope. Owner is never denied.
// 4. A DEVICE principal binds only device-kind roles.
//
// Each RPC comment names its gate (the catalog permission the caller must hold
// in organization_id) and its signing tier: bearer, or signed (the request is
// a SignedRequest). Errors use the gRPC status code named in the comment.
//
// This service replaces DeviceAccessService, OrganizationService.
// UpdateMemberRole, the realm-group role mappings, OrgTeamService team
// permissions and RoleService.ListEffectivePermissions.
service AccessService {
  // Bindings of the organization, ordered by created_at, then id. All filters
  // are optional and combine with AND. Bindings whose scope or principal is a
  // device the caller cannot reach are absent, and nothing counts them.
  // Gate: `access:list`. Bearer.
  // INVALID_ARGUMENT for a filter that breaks the Binding id/ref rules.
  rpc ListBindings(ListBindingsRequest) returns (ListBindingsResponse);
  // Gate: `access:create`, or the share rule.
  //
  // Share rule (caller without `access:create`): the scope is DEVICE, the
  // role is device kind, the effect is ALLOW, and the caller holds every
  // permission of the role on that device.
  //
  // Escalation guard, for every caller: the role's permissions must be a
  // subset of the caller's own. So only an Owner binds Owner; ownership moves
  // only through OrganizationService.TransferOwnership.
  //
  // INVALID_ARGUMENT for an UNSPECIFIED type or effect, an id/ref that breaks
  // the Binding rules, or a broken invariant; NOT_FOUND if the principal, role
  // or device/site scope is not in the organization; PERMISSION_DENIED under
  // the escalation guard or the share rule; ALREADY_EXISTS for a binding with
  // the same principal, role, scope and effect.
  // Signed; payload_type "wendycloud.v2.CreateBindingRequest".
  rpc CreateBinding(SignedRequest) returns (Binding) {
    option (wendy.signed_request) = true;
  }
  // Gate: `access:delete`, or the caller created the binding (created_by).
  // NOT_FOUND if the binding is not in the organization;
  // PERMISSION_DENIED for a caller without `access:delete` who did not create
  // it; FAILED_PRECONDITION if it is the organization's last Owner binding.
  // Signed; payload_type "wendycloud.v2.DeleteBindingRequest".
  rpc DeleteBinding(SignedRequest) returns (DeleteBindingResponse) {
    option (wendy.signed_request) = true;
  }
  // The permissions a principal effectively holds, each with the bindings that
  // grant it. With device_id: the permissions it holds on that device. Without:
  // the organization view, where a device-targeted permission appears when it
  // is held on at least one device. Ceiling-clipped and denied permissions are
  // absent. Gate: `permission:read`; none when the principal is the caller.
  // Bearer. Replaces RoleService.ListEffectivePermissions.
  // INVALID_ARGUMENT for an UNSPECIFIED principal type; NOT_FOUND if the
  // principal or the device is not in the organization.
  rpc GetEffectivePermissions(GetEffectivePermissionsRequest) returns (GetEffectivePermissionsResponse);
  // "Who has this role": the bindings naming the role, allow and deny, with
  // group principals left unexpanded. Ordered and hidden as ListBindings.
  // Gate: `access:list`. Bearer.
  // NOT_FOUND if the role is neither built-in nor owned by the organization.
  rpc ListRoleHolders(ListRoleHoldersRequest) returns (ListRoleHoldersResponse);
}

enum BindingPrincipalType {
  BINDING_PRINCIPAL_TYPE_UNSPECIFIED = 0;
  // id = user ID, as in organization membership.
  BINDING_PRINCIPAL_TYPE_USER = 1;
  // id = cloud group UUID, or an identity-provider (realm) group spelled
  // "<realm-issuer>#<group>" as in the wendy-auth `groups` claim. Applies to
  // every member of the group.
  BINDING_PRINCIPAL_TYPE_GROUP = 2;
  // id = the device's Asset.id. Binds device-kind roles only.
  BINDING_PRINCIPAL_TYPE_DEVICE = 3;
}

enum BindingScopeType {
  BINDING_SCOPE_TYPE_UNSPECIFIED = 0;
  // Everything in the organization; ref is empty. The only scope an
  // organization-kind role binds at.
  BINDING_SCOPE_TYPE_ORGANIZATION = 1;
  // ref = Site.id. Covers the devices in the site when the check runs.
  BINDING_SCOPE_TYPE_SITE = 2;
  // ref = the tag name, matched against Asset tags when the check runs. A tag
  // on no device yet is allowed.
  BINDING_SCOPE_TYPE_TAG = 3;
  // ref = the device's Asset.id.
  BINDING_SCOPE_TYPE_DEVICE = 4;
}

enum BindingEffect {
  BINDING_EFFECT_UNSPECIFIED = 0;
  BINDING_EFFECT_ALLOW = 1;
  // Removes the role's permissions from the principal wherever the scope
  // covers, whatever allow grants them. Skipped for a subject holding Owner;
  // never on the Owner role itself.
  BINDING_EFFECT_DENY = 2;
}

message BindingPrincipal {
  BindingPrincipalType type = 1;
  // Non-empty; meaning per BindingPrincipalType.
  string id = 2;
  // User name or email, group name, or device name, resolved when read.
  // Empty if it cannot be resolved; show id instead.
  string display_name = 3;
}

message BindingRole {
  string id = 1;
  string name = 2;
  RoleKind kind = 3;
}

message BindingScope {
  BindingScopeType type = 1;
  // Meaning per BindingScopeType; empty exactly for ORGANIZATION.
  string ref = 2;
  // Human name, filled by the server when read and ignored on input: the site
  // or device name, the tag text, empty for ORGANIZATION. Empty if it cannot
  // be resolved; show ref instead.
  string display_name = 3;
}

message Binding {
  string id = 1;
  string organization_id = 2;
  BindingPrincipal principal = 3;
  BindingRole role = 4;
  BindingScope scope = 5;
  BindingEffect effect = 6;
  // User ID of the creator. Empty for bindings written by the upgrade
  // backfill or the system, or when the creator's account is gone.
  string created_by = 7;
  google.protobuf.Timestamp created_at = 8;
}

message ListBindingsRequest {
  string organization_id = 1;
  // Principal filter: UNSPECIFIED = none; otherwise principal_id is required
  // and matches exactly (a user filter does not include the user's groups).
  BindingPrincipalType principal_type = 2;
  string principal_id = 3;
  // Role filter: empty = none.
  string role_id = 4;
  // Scope filter: UNSPECIFIED = none. DEVICE returns every binding that covers
  // the device: on the device itself, its site, any of its tags, or the
  // organization. ORGANIZATION, SITE and TAG match exactly.
  BindingScopeType scope_type = 5;
  string scope_ref = 6;
  // Effect filter: UNSPECIFIED = none.
  BindingEffect effect = 7;
  // Creator filter (user ID): empty = none.
  string created_by = 8;
  // At most this many rows; 0 = the server default. The server caps it.
  int32 page_size = 9;
  // next_page_token of the previous page; empty = the first page.
  string page_token = 10;
}

message ListBindingsResponse {
  repeated Binding bindings = 1;
  // Empty = the last page.
  string next_page_token = 2;
}

message CreateBindingRequest {
  string organization_id = 1;
  BindingPrincipalType principal_type = 2;
  string principal_id = 3;
  string role_id = 4;
  BindingScopeType scope_type = 5;
  string scope_ref = 6;
  BindingEffect effect = 7;
}

message DeleteBindingRequest {
  string organization_id = 1;
  string binding_id = 2;
}

message DeleteBindingResponse {}

message GetEffectivePermissionsRequest {
  string organization_id = 1;
  BindingPrincipalType principal_type = 2;
  string principal_id = 3;
  // Asset.id; empty = the organization view.
  string device_id = 4;
}

message GrantedPermission {
  // Catalog permission name (Permission.name).
  string permission = 1;
  // The allow bindings that grant it here, ordered as ListBindings. Includes
  // bindings reached through the principal's groups.
  repeated Binding bindings = 2;
}

message GetEffectivePermissionsResponse {
  // One entry per permission, ordered by permission.
  repeated GrantedPermission permissions = 1;
}

message ListRoleHoldersRequest {
  string organization_id = 1;
  string role_id = 2;
  // At most this many rows; 0 = the server default. The server caps it.
  int32 page_size = 3;
  // next_page_token of the previous page; empty = the first page.
  string page_token = 4;
}

message ListRoleHoldersResponse {
  repeated Binding bindings = 1;
  // Empty = the last page.
  string next_page_token = 2;
}
