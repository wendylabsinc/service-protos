syntax = "proto3";

package wendycloud.v2;

import "google/protobuf/timestamp.proto";
import "wendy/options.proto";
import "wendycloud/v2/deployments.proto";
import "wendycloud/v2/signed_request.proto";

// Encrypted artifact registry (Apps & Deployments spec v2, approved
// 2026-10-19 01:15; lean registry design approved 2026-10-18 14:28). Scope:
// OCI artifacts for tier A/B devices. Tier C (wendy-lite) firmware is not OCI
// and gets its own contract (sem 2026-10-18 16:37).
//
// Invariants this file encodes:
// - The registry is blind. It stores ciphertext, wraps and signed public-key
//   registrations. No RPC carries a plaintext key, and no server produces a
//   wrap: wraps are made by an operator client and arrive inside a request that
//   operator signed. A compromised registry can withhold or delete, never grant.
// - Authority is the operator signature. A device acts on its own signed
//   assignment (DeploymentService.AssignDevice, formerly
//   ArtifactRegistryService.AssignDevice) and checks every byte it
//   fetches here against digests that assignment signs. A wrong blob or a wrong
//   wrap fails closed on the device.
// - Device pull authorization is the live assignment: device from the mTLS
//   leaf, tenant from its SAN, never from the request.
//
// Not in this file: the registry <-> cloud assignment check (both live in the
// cloud repo, internal API); the custodian key and its accepted key ids
// (config, not wire).
//
// Operator keys are per DEVICE (sem 2026-10-20 21:29, decision 5 closed): every
// operator device or browser generates and registers its own key, so one user
// holds several live keys. A device that already holds a wrap re-wraps onward
// (GetMyWraps, then AddWraps) for a device the same user signs in on later.
//
// Sessions and approval (WDY-4375, sem 2026-11-24 17:38). Each operator key
// is one SESSION: one machine or browser of one user. A session is either
// approved or waiting. Access is passed on by one action, whoever the target
// is: a session that already holds wraps re-wraps them to another session,
// and only because a person did it there (CLI or console). Two targets:
// - Another session of the SAME user (approve a new session):
//   KeyDirectoryService.ApproveSession records that it is approved, then the
//   approving session passes on every wrap it holds (GetMyWraps listing,
//   AddWraps).
// - Another MEMBER (unlock an item): a member holding a wrap re-wraps it to
//   the approved sessions of that member (GetRecipientKeys, AddWraps).
// Approval is a SessionApproval signed with the approving session's approval
// key, which no one but that session holds; Cloud stores and serves it and
// cannot make one. A user's first session approves itself (the root). Nothing
// is wrapped to a waiting session. Reads that find no wrap tell the client
// why (GetMyWrapsResponse.missing), so it can show the right text.
// Releases and deployments keep their custodian wraps; nothing here adds a
// custodian path, and secrets never get one.

// ==================== Key directory ====================

// Recipient encryption public keys live in cloud's database next to the users
// and devices that generated them (Q2, sem 2026-10-18 23:45). pki-core is not
// involved: no key hash in certificates, no enrollment-body change. Each key is
// registered in a request its principal signed with its own certificate, and
// that signed statement is served back with the key, so cloud is an untrusted
// courier: it can withhold a key, never substitute one.
service KeyDirectoryService {
  // An operator registers its user encryption key at sign-in, next to
  // OperatorSessionService.RegisterOperatorLeaf. Signed with `x5c` (operator
  // leaf): the stored request is the binding. One key per operator DEVICE (sem
  // 2026-10-20 21:29): each device or browser of the user registers its own
  // key, and the user may hold several live keys. A registration adds a key; it
  // never replaces another device's key. Replacement applies to one device's
  // own key only. TODO(ruling): how a device's old key is retired when that
  // device rotates (no wire field ties two key ids to one device yet).
  // A client may keep its key across a logout and a later login of the SAME
  // account (WDY-4375 default D): registering the same public_key again is
  // not a new session, and keeps its approval and its wraps. Registering it
  // with an approval_public_key other than the one stored is refused
  // (ALREADY_EXISTS); a key stored without one (a client that predates
  // WDY-4375) takes one once. A revoked key_id is never accepted again
  // (FAILED_PRECONDITION).
  // Signed; payload_type "wendycloud.v2.RegisterEncryptionKeyRequest".
  rpc RegisterUserEncryptionKey(SignedRequest) returns (RegisterEncryptionKeyResponse) {
    option (wendy.signed_request) = true;
  }
  // Records one session of the caller as approved (WDY-4375). The approval is
  // made and signed by the approving session (SignedSessionApproval); Cloud
  // only stores it, then serves it in RecipientKey.approval. Cloud checks,
  // refusing with FAILED_PRECONDITION: approval.user is the caller;
  // approval.key_id is a live key of the caller that has an
  // approval_public_key and no approval yet (ALREADY_EXISTS if approved);
  // the signature verifies with the approver's approval_public_key; and
  // either approver_key_id is another live, approved key of the caller (a
  // session that approves must itself be approved), or approver_key_id equals
  // key_id (the root) and the caller has no other live approved key. Cloud's
  // checks are a courtesy; clients check the same chain themselves
  // (RecipientKey). The approving client then passes on its wraps with
  // AddWraps.
  // Signed; payload_type "wendycloud.v2.ApproveSessionRequest".
  rpc ApproveSession(SignedRequest) returns (ApproveSessionResponse) {
    option (wendy.signed_request) = true;
  }
  // Ends one session of the caller (WDY-4375): the key stops being live, and
  // every wrap addressed to it, at every scope, is deleted. A lost machine,
  // or a sign-out that does not keep the key. Only the key's own user, from
  // any session (FAILED_PRECONDITION for another user's key). Approvals the
  // key made earlier stay valid; it makes no new ones. Cloud does the same
  // for every key of a user whose membership of the organization ends.
  // Signed; payload_type "wendycloud.v2.RevokeUserEncryptionKeyRequest".
  rpc RevokeUserEncryptionKey(SignedRequest) returns (RevokeUserEncryptionKeyResponse) {
    option (wendy.signed_request) = true;
  }
  // A device registers the encryption key it generated at enrollment, over its
  // own mTLS. Device-signed (wendy.device_signed_request): `x5c` = the device
  // leaf, which must be the mTLS peer.
  // payload_type "wendycloud.v2.RegisterEncryptionKeyRequest".
  // TODO(ungrounded): when the agent sends this relative to enrollment (first
  // call after enrollment is assumed) is not ruled; until it has, the device is
  // reported in GetRecipientKeysResponse.unbound and cannot be targeted.
  rpc RegisterDeviceEncryptionKey(SignedRequest) returns (RegisterEncryptionKeyResponse) {
    option (wendy.device_signed_request) = true;
  }
  rpc GetRecipientKeys(GetRecipientKeysRequest) returns (GetRecipientKeysResponse);
}

// Every principal registers KEM_SUITE_MLKEM768_X25519 (Q5). Cloud refuses any
// other suite.
message RegisterEncryptionKeyRequest {
  string organization_id = 1;  // tenant UUID
  KemSuite suite = 2;
  bytes public_key = 3;
  // User keys only (WDY-4375); a device key leaves both empty. The session's
  // approval key: an ML-DSA-65 public key (FIPS 204 encoding) the session
  // generates with public_key and keeps with it. It signs SessionApprovals
  // and nothing else. A key registered without one can never be approved.
  bytes approval_public_key = 4;
  // What the user sees when asked to approve this session: the machine name
  // (host name) or the browser, at most 64 UTF-8 bytes. Under the user's
  // signature, so Cloud cannot change it. The registration's JWS iat is the
  // time the session was registered.
  string machine_name = 5;
}

message RegisterEncryptionKeyResponse {
  string key_id = 1;  // SHA-256 (hex) of public_key
}

message GetRecipientKeysRequest {
  string organization_id = 1;
  repeated string principals = 2;  // device or user SPIFFE URIs
  // Instead of principals (WDY-4375 G): every current member whose
  // permissions reach this app, the same set as
  // PublishArtifactResponse.auto_grant_keys. Cloud supplies these candidates
  // only: the client verifies each key, wraps only to approved sessions, and
  // shows the members' names in the review its operator confirms. Setting
  // both principals and app_id is INVALID_ARGUMENT.
  string app_id = 3;
}

// The client trusts `registration` and `chain_der` only as far as they chain
// to its own pinned platform root; cloud serves them and is untrusted. It
// verifies the JWS over the payload bytes with the `x5c` leaf, chains that
// leaf through `chain_der` to the tenant CA (valid at the JWS `iat`), and
// anchors the tenant CA to the client-pinned platform root, never to the
// cloud-served chain alone (a compromised cloud could serve its own CA). It
// checks the CA's tenant equals organization_id, the leaf identity equals
// `principal`, payload_type is "wendycloud.v2.RegisterEncryptionKeyRequest",
// the JWS operation is the matching Register* method, then decodes the payload
// and recomputes key_id = SHA-256(public_key) locally. For a device key the
// issuing CA fixes the algorithm: a leaf under the Device Identity CA signs
// ML-DSA-65 only, a leaf under the Lite Device CA ES256 only; anything else is
// refused (conformance/reqsig/README.md, device-signer profile).
//
// A user key is an APPROVED session (WDY-4375) only when its approval chain
// verifies, checked by the client, never taken from Cloud: approval names
// this organization, principal and key_id; its signature verifies with the
// approval_public_key in the approver's verified registration (one of this
// response's keys or approvers, same principal); and the approver is itself
// approved, until a root (approver_key_id = key_id). All of one user's
// approved keys chain to ONE root; a client that finds two refuses every key
// of that user and tells its operator. A client that has wrapped to a member
// before remembers that member's root key_id; when it changes (the member
// lost every session and started again), it says so in the review before it
// wraps. A waiting session (no approval, or one that does not verify) is
// never wrapped to.
message RecipientKey {
  string principal = 1;
  SignedRequest registration = 2;  // verbatim as registered
  // Intermediates from the signing leaf up to and including the tenant CA,
  // DER. The leaf itself is the `x5c` in `registration`.
  repeated bytes chain_der = 3;
  // User keys only: this session's approval, verbatim as recorded by
  // ApproveSession. Empty = waiting.
  SignedSessionApproval approval = 4;
  // Only for the caller's own keys (false for anyone else's): this key holds
  // at least one wrap. Cloud-asserted, for display: after login, a client
  // whose own key is waiting while another of its user's keys is approved
  // and holds wraps asks the user to approve this session from that one.
  bool holds_wraps = 5;
}

message GetRecipientKeysResponse {
  // One entry per live key. A user principal appears once per registered
  // operator device key, waiting sessions included (each with an empty
  // approval). The client wraps only to devices and approved sessions.
  repeated RecipientKey keys = 1;
  // Principals with no live registration (never registered, revoked, deleted):
  // the client refuses to target them.
  repeated string unbound = 2;
  // Keys that are no longer live but approved a key in `keys`, directly or
  // through another approver: served only so the client can verify approval
  // chains. Never wrapped to.
  repeated RecipientKey approvers = 3;
}

// One session approving another session of the same user, or itself as the
// root (WDY-4375). Signed with the approver's approval key, never by Cloud.
// Signature layout: conformance/registry/README.md, session approval.
message SessionApproval {
  string organization_id = 1;
  // The user's SPIFFE URI: approver and approved session belong to it.
  string user = 2;
  // The approved session's key (RegisterEncryptionKeyResponse.key_id).
  string key_id = 3;
  // The approving session's key; equal to key_id for the root.
  string approver_key_id = 4;
}

message SignedSessionApproval {
  // A serialized SessionApproval: the exact bytes signed. Verify, then decode.
  bytes statement = 1;
  // ML-DSA-65 over the statement (conformance/registry/README.md).
  bytes signature = 2;
}

message ApproveSessionRequest {
  string organization_id = 1;
  SignedSessionApproval approval = 2;
}

message ApproveSessionResponse {}

message RevokeUserEncryptionKeyRequest {
  string organization_id = 1;
  string key_id = 2;
}

message RevokeUserEncryptionKeyResponse {
  // Wraps deleted with the key.
  uint32 removed_wraps = 1;
}

// ==================== Operator side ====================

// Operator-facing registry API (CLI, console). Bearer + DPoP; state-changing
// calls are SignedRequests and audited with the signer.
service ArtifactRegistryService {
  // Opens the upload of one release's artifact. Records the clear manifest,
  // sets AppRelease.image_digest to manifest_digest, and returns the ciphertext
  // this upload still has to send. The release is servable once every blob is
  // present and a CUSTODIAN wrap exists at release scope.
  // Signed; payload_type "wendycloud.v2.PublishArtifactRequest".
  rpc PublishArtifact(SignedRequest) returns (PublishArtifactResponse) {
    option (wendy.signed_request) = true;
  }
  // Client stream: one header, then data. Not signed: client-streaming RPCs
  // are never signed (conformance/reqsig/README.md); authorized by the
  // upload_id that the signed PublishArtifact returned. The registry checks the
  // promised ciphertext digest and size; it cannot check plaintext.
  // Write-once per digest.
  rpc PutBlob(stream PutBlobRequest) returns (PutBlobResponse);
  // Attaches wraps and sealed content keys made client-side: release scope at
  // publish (publisher, pre-granted users, custodian), deployment scope at
  // deployment create, operator invite and rotation; secret scope after
  // SetSecret and whenever access passes on (same path and gate as the
  // release scope; no client makes a CUSTODIAN wrap there, and AddWraps
  // refuses one as a tripwire). Device wraps travel in
  // DeviceAssignment instead.
  // Passing on (WDY-4375): a USER wrap is also accepted from a caller
  // without the scope's write gate when, for each such wrap, the caller holds
  // a live wrap at the same scope and key_id on one of its own keys, the
  // recipient key is a live approved session (RecipientKey.approval), and the
  // recipient may read the item (artifact:read in the app for a release or a
  // secret; GetDeployment's gate for a deployment). This is how a session
  // passes its wraps to a newly approved session of its user, and how a
  // member unlocks an item, or every item of an app it holds, for another
  // member. Refused with PERMISSION_DENIED otherwise. A client wraps only to
  // recipients its operator saw: the approved session, or the member named
  // in the unlock.
  // Signed; payload_type "wendycloud.v2.AddWrapsRequest".
  rpc AddWraps(SignedRequest) returns (AddWrapsResponse) {
    option (wendy.signed_request) = true;
  }
  // Deletes wrap rows; needs no key. Operator removal. A whole session's
  // wraps go with KeyDirectoryService.RevokeUserEncryptionKey.
  // Signed; payload_type "wendycloud.v2.RemoveWrapsRequest".
  rpc RemoveWraps(SignedRequest) returns (RemoveWrapsResponse) {
    option (wendy.signed_request) = true;
  }
  rpc GetArtifact(GetArtifactRequest) returns (GetArtifactResponse);
  // Wraps addressed to the CALLER's own keys only (recipient from the
  // authenticated principal, never from the request), so an operator client
  // can unwrap a key to wrap it onward. A user has one key per device; each
  // device opens the wraps at its own recipient_key_id.
  // With scope unset it lists every wrap the caller holds, paged, optionally
  // narrowed to one app: what a session passes on when it approves another
  // session, or when its member unlocks a whole app for someone (WDY-4375).
  rpc GetMyWraps(GetMyWrapsRequest) returns (GetMyWrapsResponse);
  // What the registry stores for one organization (apps and deployments spec
  // 6.8, G7): each release's artifact with its size, who published it and
  // when, whether every blob is stored, and the deployments that use it.
  // Newest first by published_at, then app_release_id. A read: not signed.
  // Gate: `artifact:read` in organization_id. organization_id must be the
  // caller's verified organization (PERMISSION_DENIED otherwise), and every
  // row is bound to it. Metadata only: ciphertext sizes, never keys,
  // manifests, plaintext sizes or plaintext digests. The CLI calls the
  // registry directly; the dashboard calls cloud, which forwards this same
  // call with the operator's identity.
  rpc ListArtifacts(ListArtifactsRequest) returns (ListArtifactsResponse);

  // ==================== App secrets (WDY-4374) ====================
  // Configuration splits in two (sem 2026-11-24 17:14): VARIABLES stay
  // configuration (config_json, readable as today) and SECRETS are values
  // Wendy must not be able to read. A secret belongs to one app (organization
  // + app) and has a name. It is handled like a release's content key: the
  // client encrypts the value under a fresh secret key (SealedSecret) and
  // wraps that key with the existing wrap format (KeyWrap) to the operator
  // keys that reach the app, at the secret scope (WrapScope.secret_version).
  // Never to the custodian. The rule binds the CLIENT: a client never makes a
  // CUSTODIAN wrap at the secret scope (WrapScope; conformance/registry/README.md,
  // key wrap), so neither Cloud nor its KMS can open a secret. AddWraps also
  // refuses one (INVALID_ARGUMENT), only as a tripwire: the guarantee is that
  // no client makes one. A client that finds a CUSTODIAN wrap at a secret
  // version's scope treats that version as compromised: it never uses it (no
  // wrap onward, never in a DeviceAssignment), tells its operator, and reports
  // it, naming the app, the secret name and the version; the secret is then set
  // again as a new version.
  // Devices get each secret in their signed DeviceAssignment (secrets).
  //
  // Names: one written rule for secret names and for configuration names (the
  // keys of config_json), the agent's environment-name check: ASCII
  // [A-Za-z_][A-Za-z0-9_]*; not starting, in any case, with LD_, DYLD_,
  // WENDY_, ROS_ or OTEL_; not RMW_IMPLEMENTATION or CYCLONEDDS_URI (variables
  // the agent sets itself). SetSecret refuses another name (INVALID_ARGUMENT);
  // the device refuses an assignment that carries one.
  // A name is never both a variable and a secret in one deployment revision.
  // That is checked per revision only: Cloud refuses a revision whose
  // config_json has a key that is also one of its secret names
  // (DeploymentRevision.secrets), and the device refuses such an assignment
  // (DeviceAssignment.secrets). SetSecret does not look at releases or
  // deployments, so a variable moves to a secret while old releases and live
  // deployments still carry it as a variable: set the secret, then a new
  // revision drops the variable and carries the secret.
  //
  // Readback is names and metadata only (SecretInfo, SecretRef): no message
  // returns a value in clear. The sealed value goes back only with the
  // caller's own wraps (GetMyWraps), inside the setter's signed SetSecret
  // request (SignedSecretVersion), so a key holder can wrap onward and Cloud
  // cannot plant a value of its own.
  //
  // The console calls these same RPCs with its browser operator key (an
  // ordinary RECIPIENT_KIND_USER key); nothing about secrets is CLI-only.

  // Sets a NEW version of one secret: creating a name (version 1) and
  // replacing its value (current version + 1) are the same call. Refused with
  // ABORTED unless value.version is the current version + 1 (1 for a new
  // name). A version never changes. Replacing a value does not touch any
  // deployment: a new deployment revision picks the new version (SecretRef).
  // Same gate as PublishArtifact for the app. Refused with FAILED_PRECONDITION
  // while the app is being deleted. The response lists the keys the client
  // then wraps the secret key to with AddWraps, besides its own. A version
  // whose wraps never arrive has no Cloud rule: the client retries AddWraps,
  // or the operator sets the secret again.
  // Signed with `x5c` only (`kid` is refused): Cloud stores the request
  // verbatim and serves it back as SignedSecretVersion.set_request, which is
  // what lets a later client check who set the value.
  // Signed; payload_type "wendycloud.v2.SetSecretRequest".
  rpc SetSecret(SignedRequest) returns (SetSecretResponse) {
    option (wendy.signed_request) = true;
  }
  // Removes one secret name: every version, its sealed value and every wrap.
  // Refused with FAILED_PRECONDITION, naming the deployments, while the
  // current revision of a live deployment carries it: update those first.
  // Devices keep what they last applied until a new revision reaches them. A
  // rollback to a revision that carried a removed secret is refused
  // (RollbackDeployment). Deleting the app removes its secrets. Same gate as
  // SetSecret.
  // Signed; payload_type "wendycloud.v2.RemoveSecretRequest".
  rpc RemoveSecret(SignedRequest) returns (RemoveSecretResponse) {
    option (wendy.signed_request) = true;
  }
  // The app's secrets at their current version, by name. Metadata only. Same
  // gate as ListArtifacts (`artifact:read`). A read: not signed. There is no
  // per-name history read.
  rpc ListSecrets(ListSecretsRequest) returns (ListSecretsResponse);

  // One signed statement per target device (Q7, sem 2026-10-19 01:15: one
  // signature per device, not per deployment), postbox-relayed verbatim to that
  // device. It is the device's authority to apply AND its pull authorization.
  // Cloud refuses it unless the deployment has a SealedContentKey and a
  // CUSTODIAN wrap at deployment_key_id. For a registry-backed release,
  // CreateDeployment records the deployment only; devices receive it here.
  // Deprecated: moved to DeploymentService.AssignDevice (ruling D2); removed
  // when the registry service splits out. Kept until every client and device
  // has moved. Refused with FAILED_PRECONDITION while the app is being
  // deleted, as under the new name.
  // Signed; payload_type "wendycloud.v2.DeviceAssignment".
  rpc AssignDevice(SignedRequest) returns (AssignDeviceResponse) {
    option (wendy.signed_request) = true;
  }
  // Postbox-relayed to the device; cloud drops the assignment, so pulls stop.
  // Deprecated: moved to DeploymentService.UnassignDevice (ruling D2); removed
  // when the registry service splits out. Kept until every client and device
  // has moved.
  // Signed; payload_type "wendycloud.v2.UnassignDeviceRequest".
  rpc UnassignDevice(SignedRequest) returns (UnassignDeviceResponse) {
    option (wendy.signed_request) = true;
  }
}

// Everything the device checks comes from here, under the operator signature:
// it targets this one device, pins the release digest and the deployment key,
// and carries the device's own wrap of that key. Rotation = a new assignment
// per device at the new key id (Q6), at the same revision.
//
// The device's ordering rules (revisions; with UnassignDeviceRequest and
// DetachDeviceRequest):
// - It keeps, per deployment_id, the highest revision it has accepted and
//   whether that was a removal. It keeps that mark after a removal for at
//   least the platform cap (1 year), persistently across restarts.
// - It refuses revision 0, and an assignment at the maximum revision
//   (2147483647), which only a terminal removal carries.
// - It refuses an assignment whose revision is lower than the mark, or equal
//   to a removal's mark. So once the mark is the maximum (a terminal removal),
//   every assignment for that deployment_id is refused: none can be above it,
//   and the equal-revision rule below applies only to an assignment's mark.
// - At a revision equal to an assignment's mark, it accepts only identical
//   app_release_id, manifest_digest, config_json, desired_state, replaces_*
//   and each secret's value (deployment_key_id, device_wrap, expires_at and each
//   secret's device_wrap may differ: key rotation),
//   and does not apply replaces_* again: the move was applied with the first
//   copy. The replaces_* checks below apply only above the mark.
// - One instance per app: it refuses an assignment for app_id while it holds
//   another live deployment of that app, unless that deployment is
//   replaces_deployment_id. A detached deployment is not a held live
//   deployment: a later deployment of an app with that id replaces the
//   direct run.
// - Never across apps: it refuses replaces_deployment_id naming a deployment
//   it holds for a different app_id.
message DeviceAssignment {
  string organization_id = 1;
  string deployment_id = 2;
  string device = 3;  // the target device's SPIFFE URI
  string app_id = 4;
  string app_release_id = 5;
  string manifest_digest = 6;
  string deployment_key_id = 7;
  Running desired_state = 8;
  KeyWrap device_wrap = 9;  // recipient = device, scope = deployment at deployment_key_id
  // The assignment's instruction validity (WDY-4015 item 3): this message's
  // valid_until, under the same rules (conformance/postbox-entry/README.md).
  google.protobuf.Timestamp expires_at = 10;
  // The configuration the device applies: the deployment revision's
  // resolved text, verbatim, so the signed bytes are what the device applies.
  // Never empty (no configuration is `{}`). The device refuses an assignment
  // whose config_json is empty, is not one JSON object, or is over 64 KiB.
  string config_json = 11;
  // The deployment revision this statement implements. Statements for one
  // deployment are ordered by revision, never by a timestamp (rules above).
  // Cloud refuses revision 0 (a client that predates revisions), the maximum
  // revision, and any statement whose release, config_json, desired_state,
  // replaces_* or device does not match the deployment's current revision.
  // Cloud treats a device as still in its previous deployment of the app
  // until that deployment's removal statement for it has been received:
  // until then an Assign must be a move replacing it, or cloud refuses with
  // FAILED_PRECONDITION.
  int32 revision = 12;
  // A move (one atomic statement, never an Unassign plus an Assign): the other
  // deployment of the SAME app_id this device leaves, and that deployment's
  // current revision once the move is recorded. That is the revision the move
  // creates in it, or, when its current set already excludes the device (a
  // removal not yet received), its current revision. Both empty/0 = not a
  // move. Applying it removes the replaced deployment's instance and installs
  // this one as one step. The old side of a move is a NON-terminal removal:
  // the replaced deployment lives on and may take this device back later, so
  // replaces_revision is never 0 and never the maximum.
  // Above the mark for deployment_id, the device refuses it when
  // replaces_revision is below its mark for replaces_deployment_id or equal to
  // an assignment's mark there, is 0 or the maximum, when
  // replaces_deployment_id equals deployment_id, or when it holds
  // replaces_deployment_id for a different app_id. A replaces_revision equal
  // to an existing REMOVAL mark for replaces_deployment_id means the old side
  // is already done (its removal arrived first): it installs this deployment.
  // On apply, it records replaces_revision as a removal mark for
  // replaces_deployment_id.
  // Cloud refuses replaces_* naming a deployment of another app, or not
  // matching the move it recorded. Once received, the statement counts as the
  // replaced deployment's removal for this device.
  string replaces_deployment_id = 13;
  int32 replaces_revision = 14;
  // The app's secrets for this device (WDY-4374): for each secret the
  // revision carries (DeploymentRevision.secrets), the sealed value and the
  // secret key wrapped to THIS device's registered encryption key. Nothing
  // about secrets is sealed under the deployment key, whose custodian wrap
  // stays as it is. Under the operator's signature like every other field.
  // The signing client copies each value byte for byte from a
  // SignedSecretVersion it has verified (GetMyWraps), never from anything
  // unsigned: a value without a valid signed SetSecret request is never placed
  // here.
  // Cloud refuses the statement unless its (name, version) set equals the
  // revision's, each value is byte-equal to the stored SealedSecret, and each
  // device_wrap is to this device's live key at that secret's scope.
  // The device opens each wrap (scope kind 3, conformance/registry/README.md)
  // and each value, and refuses the whole assignment (REJECTED_UNWRAP) if one
  // does not open, a name repeats, a name breaks the name rule
  // (ArtifactRegistryService, app secrets), a name is also a key of
  // config_json, or it is above the limits: at most 64 secrets and 64 KiB of
  // values in total. REJECTED_UNWRAP covers every one of these; there is no
  // new ApplyOutcome value.
  // It applies each as NAME=VALUE beside the configuration. Its postbox copy
  // keeps the sealed form; values are in clear only where the app's
  // environment needs them. Empty = no secrets in this revision.
  // An agent that predates this field would ignore it and run the app without
  // its secrets, so cloud holds back an assignment that carries secrets until
  // the device's pull lists "wendycloud.v2.DeviceAssignment.secrets" in
  // PullChangesRequest.accepted_fields (postbox.proto).
  repeated DeviceSecret secrets = 15;
}

// One secret in one DeviceAssignment.
message DeviceSecret {
  SealedSecret value = 1;
  // recipient_kind DEVICE, recipient = the assignment's device, scope =
  // value's secret_version, key_id = value.secret_key_id.
  KeyWrap device_wrap = 2;
}

message AssignDeviceResponse {
  int64 postbox_entry_id = 1;
}

message UnassignDeviceRequest {
  string organization_id = 1;
  string deployment_id = 2;
  string device = 3;
  // Instruction validity (WDY-4015 item 3, sem 2026-10-23 22:27), under the
  // operator's signature: required when cloud relays the request to a device
  // postbox. Rules: conformance/postbox-entry/README.md.
  google.protobuf.Timestamp valid_until = 4;
  // Never 0. Two cases:
  // - TERMINAL removal: the deployment itself ends (RemoveDeployment, or
  //   DeleteApp's device_removals). Carries the maximum revision, 2147483647,
  //   whatever revision cloud records the removal as. The deployment is then
  //   permanently dead on the device, whatever cloud later claims about
  //   revisions. Deployment ids are never reused, so nothing is lost.
  // - NON-terminal removal: a revision takes this device out of a deployment
  //   that lives on (an update that shrinks the device set). Carries the
  //   deployment's current revision when it is signed: the revision that
  //   dropped the device, or a later one if that removal was not sent before
  //   another revision followed. The device may legitimately be put back into
  //   the same deployment by a later revision. Cloud refuses any other
  //   revision, and the maximum outside RemoveDeployment and DeleteApp.
  //   (The old side of a move is also non-terminal; it travels as
  //   DeviceAssignment.replaces_revision, not as an Unassign.)
  // The device applies it when it is above its mark for deployment_id and
  // records it as a removal mark (DeviceAssignment rules); one equal to a
  // removal mark is a duplicate, consumed without effect; anything else is
  // refused. A terminal removal therefore always applies unless the
  // deployment is already terminally removed or detached; after a detach it
  // is a duplicate that deletes nothing (DetachDeviceRequest).
  // valid_until: the client defaults it to iat + the platform cap (1 year),
  // and the tenant cap does not apply to removals
  // (conformance/postbox-entry/README.md).
  int32 revision = 5;
}

message UnassignDeviceResponse {
  int64 postbox_entry_id = 1;
}

// Detach one device from one deployment when the app is deleted (sem
// 2026-11-12 21:19): the app is NOT removed. It stays on the device and
// becomes a direct run, as if started with `wendy run`: no deployment behind
// it, and controlled by whoever has access to the device (stop and start
// remotely, remove locally). Signed by an operator who may delete the app,
// for this one device; accepted only inside DeleteAppRequest.device_detachments
// (DeploymentService.DetachDevice). Postbox-relayed verbatim to that device
// only, `x5c` only. Its JWS `target.resource` is the deployment's, as for
// UnassignDevice; the device binding is the payload's `device`, which the
// device checks equals itself. Cloud never chooses who is detached.
// What the device checks: the chain, signature, tenant and validity as for
// every relayed statement; the target is this device; app_id is the app of
// deployment_id if it holds that deployment.
// What the device does, as one step:
// - Records the maximum revision as a removal mark (the removal flag set)
//   for deployment_id, exactly as a terminal removal, also when it does not
//   hold that deployment, so nothing can re-attach it and a move into it is
//   refused.
// - If it holds the deployment: keeps what it last applied (the container,
//   its imported release image, configuration and run state) and the
//   deployment's restart behaviour (restarts on boot; stays stopped if it was
//   stopped). A pull in progress stops, and that Assign entry reports
//   SUPERSEDED. If nothing was imported, nothing stays. It drops the
//   deployment key and its pull rights, and from then on treats and reports
//   the app as a direct run.
// - Reports the entry APPLIED.
// - Whichever of a detach and a terminal removal for that deployment the
//   device applies first wins. After a detach, a later terminal removal is a
//   duplicate: consumed without effect, it deletes nothing. After a terminal
//   removal, a later detach is a duplicate: consumed without effect.
// The decrypted image and the configuration (which may hold secrets) stay at
// rest on a detached device by design; the delete confirmation says so.
message DetachDeviceRequest {
  string organization_id = 1;
  string deployment_id = 2;
  // The target device's SPIFFE URI.
  string device = 3;
  string app_id = 4;
  // Instruction validity, under the operator's signature
  // (conformance/postbox-entry/README.md). The client defaults it to iat +
  // the platform cap (1 year), and the tenant cap does not apply, as for
  // removals.
  google.protobuf.Timestamp valid_until = 5;
}

message PublishArtifactRequest {
  string organization_id = 1;
  string app_release_id = 2;
  ArtifactManifest manifest = 3;
}

message PublishArtifactResponse {
  string upload_id = 1;
  // Ciphertext digests of THIS upload not yet received (resume). No dedup
  // across releases (Q10): each release has its own content key, so identical
  // layers are stored once per release.
  repeated string missing_ciphertext_digests = 2;
  google.protobuf.Timestamp expires_at = 3;
  // Users whose current permissions already reach every release of this app.
  // The publishing client wraps the content key to each of them at release
  // scope at publish, not on request (Q1 amendment, sem 2026-10-18 16:37).
  // Candidates only (WDY-4375 G): the client verifies each key, keeps the
  // approved sessions (RecipientKey), shows the members' names in the
  // publish review its operator confirms, and wraps to nobody else. Every
  // live key is listed with its approval, as before, so a client that
  // predates WDY-4375 behaves as today. The same holds at deploy: the client
  // wraps the new deployment key to GetRecipientKeys(app_id).
  repeated RecipientKey auto_grant_keys = 4;
}

message PutBlobRequest {
  oneof part {
    PutBlobHeader header = 1;  // first message only
    bytes data = 2;
  }
}

message PutBlobHeader {
  string upload_id = 1;
  string ciphertext_digest = 2;  // "sha256:<hex>"
  uint64 ciphertext_size = 3;
}

message PutBlobResponse {
  string ciphertext_digest = 1;
}

message GetArtifactRequest {
  string organization_id = 1;
  string app_release_id = 2;
}

message GetArtifactResponse {
  ArtifactManifest manifest = 1;
}

message ListArtifactsRequest {
  string organization_id = 1;
  // Optional filter; empty = every app. An app of another organization
  // returns an empty page.
  string app_id = 2;
  // 0 or less = 100. The server caps it at 500.
  int32 page_size = 3;
  // next_page_token of the previous page; empty = the first page.
  string page_token = 4;
}

// One release's stored artifact. Releases without a registry artifact are
// not listed.
message StoredArtifact {
  string app_release_id = 1;
  string app_id = 2;
  // AppRelease.name, the release's version label.
  string release_name = 3;
  // The ciphertext of every blob the manifest promises, stored or not
  // (EncryptedBlob.ciphertext_size summed).
  uint64 ciphertext_size = 4;
  uint32 blob_count = 5;
  // The verified signer's SPIFFE URI at publish; empty when none was verified.
  string published_by = 6;
  // Empty once that user is deleted.
  string published_by_user_id = 7;
  google.protobuf.Timestamp published_at = 8;
  // Every blob the manifest promises is stored. An unfinished upload is
  // cleaned up after a day (spec 6.9).
  bool complete = 9;
  // The live deployments whose current revision uses this release; at most
  // 50, deployment_count is the total. Names: DeploymentService.
  repeated string deployment_ids = 10;
  uint32 deployment_count = 11;
}

message ListArtifactsResponse {
  repeated StoredArtifact artifacts = 1;
  // Empty = the last page.
  string next_page_token = 2;
}

message GetMyWrapsRequest {
  string organization_id = 1;
  // One item's scope. Unset = list every wrap the caller holds (paged).
  WrapScope scope = 2;
  // The calling session's key (WDY-4375): only wraps to it are returned,
  // and `missing` speaks about it. INVALID_ARGUMENT when it is not a live key
  // of the caller. Empty = every one of the caller's keys, with no `missing`
  // (a client that predates WDY-4375).
  string recipient_key_id = 3;
  // Listing only (scope unset): only scopes of this app (its releases,
  // deployments and secrets). Empty = every app.
  string app_id = 4;
  // Listing only. 0 or less = 100. The server caps it at 500 wraps.
  int32 page_size = 5;
  // next_page_token of the previous page; empty = the first page.
  string page_token = 6;
}

// Why the calling session holds no wrap for one item (WDY-4375), so the
// client shows the right text. Cloud-asserted and for display only. The
// client picks:
// - session_approved false: "You cannot access <item> because this session
//   has not been approved from your trusted device."
// - else item_created_at before member_since: "<Item> has been
//   uploaded/created before you joined <org> and is encrypted. Ask someone
//   else with access to <item> to unlock it for you."
// - else: "<Item> is encrypted and has not been unlocked for you. Ask
//   someone with access to <item> to unlock it for you."
message MissingAccess {
  // The calling session (GetMyWrapsRequest.recipient_key_id) has a recorded
  // approval.
  bool session_approved = 1;
  // When the item's key at this scope's key_id was made: the release's
  // publish, the deployment key's creation or rotation, the secret version's
  // SetSecret.
  google.protobuf.Timestamp item_created_at = 2;
  // When the caller joined the organization (OrganizationMember.created_at).
  google.protobuf.Timestamp member_since = 3;
}

message GetMyWrapsResponse {
  repeated KeyWrap wraps = 1;
  repeated SealedContentKey sealed_content_keys = 2;
  // Secret scope only: the setter's signed SetSecret request for that
  // version, returned with the caller's wraps so it can wrap the secret key
  // onward (another operator key, a device) and copy the sealed value into
  // DeviceAssignment.secrets unchanged. The value exists only inside the
  // signed request, never as a bare SealedSecret. Empty when the caller holds
  // no wrap at that scope.
  repeated SignedSecretVersion secret_versions = 3;
  // Set only when scope and recipient_key_id are set, that key holds no wrap
  // at the scope, and the caller may read the item (the gate of AddWraps'
  // passing on). For an item the caller may not read, or that does not
  // exist, the response is empty and unset alike: nothing is said about it.
  MissingAccess missing = 4;
  // Listing only. Empty = the last page.
  string next_page_token = 5;
}

// One secret version as its setter signed it, the way RecipientKey returns a
// signed key registration: Cloud is an untrusted courier and can withhold a
// version, never plant one. HPKE base mode does not authenticate who made a
// wrap, so the client trusts a secret version only through this signature.
// Before it wraps the key onward or copies the value into a
// DeviceAssignment, the client checks, refusing the version at the first
// failure:
// - The JWS over set_request verifies with its `x5c` leaf (`kid` is refused),
//   payload_type is "wendycloud.v2.SetSecretRequest", the JWS operation is
//   "wendycloud.v2.ArtifactRegistryService/SetSecret", and body_sha256 matches
//   the payload. Its nonce, iat window and expiry bound the call to Cloud and
//   are not checked again here.
// - The leaf is an operator certificate in the caller's own tenant chain: it
//   chains through chain_der to the tenant CA, valid at the JWS iat, and that
//   CA is anchored to the client-pinned platform root, never to the served
//   chain alone (as for RecipientKey). The CA's tenant, the JWS
//   target.tenant and SetSecretRequest.organization_id all equal the caller's
//   organization.
// - The signer is a current member of that organization: the operator name in
//   the leaf's SPIFFE URI is the subject of a member that
//   OrganizationService.ListMembers lists. (Membership is Cloud's word; it
//   only drops versions whose setter has left. The signature is what stops a
//   planted value.)
// - The signed SealedSecret names this app, secret name, version and
//   secret_key_id: app_id, name and version equal the requested scope
//   (WrapScope.secret_version), and secret_key_id equals the scope's key_id
//   and SHA-256 of the key the caller's own wrap opens to.
// - The ciphertext matches: the signed nonce and ciphertext open under that
//   key with the secret seal AAD, and the SealedSecret the client places in a
//   DeviceAssignment is byte-equal to the signed one.
// A version that fails any check is never wrapped onward and never placed in
// a DeviceAssignment; the client reports it to its operator.
// Vectors: conformance/postbox-entry, secret_readback_vectors.
message SignedSecretVersion {
  SignedRequest set_request = 1;  // verbatim as Cloud received it
  // Intermediates from the signing leaf up to and including the tenant CA,
  // DER. The leaf itself is the `x5c` in set_request.
  repeated bytes chain_der = 2;
}

// ==================== App secrets ====================

message SetSecretRequest {
  string organization_id = 1;
  // Its app_id, name and version say which secret version this sets.
  SealedSecret value = 2;
}

message SetSecretResponse {
  SecretInfo secret = 1;
  // Users whose current permissions reach the app: the same set
  // PublishArtifactResponse.auto_grant_keys gives for a release of it,
  // browser keys included. The client wraps the secret key to each of them,
  // and to its own key, at the secret scope with AddWraps. Candidates only,
  // as for PublishArtifactResponse.auto_grant_keys: approved sessions only,
  // named in the review the operator confirms before SetSecret is sent
  // (WDY-4375 G); Cloud never adds a recipient the operator did not see.
  repeated RecipientKey auto_grant_keys = 2;
}

message RemoveSecretRequest {
  string organization_id = 1;
  string app_id = 2;
  string name = 3;
}

message RemoveSecretResponse {}

message ListSecretsRequest {
  string organization_id = 1;
  string app_id = 2;
  // 0 or less = 100. The server caps it at 500.
  int32 page_size = 3;
  // next_page_token of the previous page; empty = the first page.
  string page_token = 4;
}

message ListSecretsResponse {
  // Ordered by name.
  repeated SecretInfo secrets = 1;
  // Empty = the last page.
  string next_page_token = 2;
}

// What anyone may read about a secret version: never its value.
message SecretInfo {
  string app_id = 1;
  string name = 2;
  int32 version = 3;
  string secret_key_id = 4;
  // The verified signer's SPIFFE URI on the SetSecret that made this version.
  string set_by = 5;
  // Empty once that user is deleted.
  string set_by_user_id = 6;
  google.protobuf.Timestamp set_at = 7;
}

// One secret version's value, encrypted on the client under that version's
// own 32-byte secret key (fresh from a CSPRNG for every version, never
// reused): AES-256-GCM, 12-byte random nonce, AAD length-prefixed over
// tenant, app_id, name, version and secret_key_id
// (conformance/registry/README.md, secret seal). Plaintext = the value,
// UTF-8 without NUL, at most 16 KiB. Cloud stores it as sent and cannot open
// it.
message SealedSecret {
  string app_id = 1;
  string name = 2;
  // From 1.
  int32 version = 3;
  string secret_key_id = 4;  // SHA-256 (hex) of the secret key
  bytes nonce = 5;
  bytes ciphertext = 6;
}

// ==================== Artifact format ====================

// The clear artifact manifest. Names, digests and sizes in clear are the
// accepted metadata residual; every blob, the OCI config blob included, is
// ciphertext.
message ArtifactManifest {
  // The release digest the operator signs: SHA-256 over oci_manifest, which
  // authenticates every plaintext_digest.
  string manifest_digest = 1;
  bytes oci_manifest = 2;  // byte-exact OCI image / OCI 1.1 artifact manifest
  ReleaseType kind = 3;    // CONTAINER, WASM or CONFIG
  repeated EncryptedBlob blobs = 4;
  string content_key_id = 5;  // SHA-256 (hex) of the content key
  AeadSuite aead = 6;
  uint32 chunk_size = 7;  // plaintext bytes per AEAD chunk; 65536 by default
}

// Dual digest. plaintext_digest is authenticated through manifest_digest;
// ciphertext_digest is the registry address and an early transport check,
// never authority.
message EncryptedBlob {
  string plaintext_digest = 1;
  string ciphertext_digest = 2;
  uint64 plaintext_size = 3;
  uint64 ciphertext_size = 4;
}

// Q4: AES-256-GCM. Q4 amendment, sem sees it: one content key covers every
// blob of a release, so chunks are NOT sealed under the content key directly
// (chunk 0 of two blobs would reuse key + nonce). Each blob gets its own key,
// HKDF-SHA256(content key, info = the blob's plaintext_digest); each chunk is
// sealed under that per-blob key with a nonce derived from (chunk index,
// last-chunk flag): truncation, reorder and splice fail authentication.
// Symmetric, so post-quantum safe as is.
// Byte layouts and vectors: conformance/registry/README.md (per-blob key,
// chunk nonce, framing; no chunk AAD).
enum AeadSuite {
  AEAD_SUITE_UNSPECIFIED = 0;
  AEAD_SUITE_AES_256_GCM_CHUNKED = 1;
}

// ==================== Keys and wraps ====================

// Q5: one suite for every recipient of an OCI artifact. P-256 wraps are dropped
// for OCI; the tier C firmware path is out of scope here (sem 2026-10-18
// 16:37).
enum KemSuite {
  KEM_SUITE_UNSPECIFIED = 0;
  // HPKE with the ML-KEM-768 + X25519 hybrid KEM, HKDF-SHA256, AES-256-GCM.
  // Tier A/B devices, users, the custodian.
  KEM_SUITE_MLKEM768_X25519 = 1;
}

enum RecipientKind {
  RECIPIENT_KIND_UNSPECIFIED = 0;
  RECIPIENT_KIND_DEVICE = 1;
  // One key per operator device (sem 2026-10-20 21:29): a user has one
  // recipient key per device or browser; recipient = the user's SPIFFE URI,
  // recipient_key_id = that device's key.
  RECIPIENT_KIND_USER = 2;
  // Wendy break-glass key; clients pin its public key per environment. The
  // custodian is a Cloud KMS KEY_ENCAPSULATION key with algorithm KEM_XWING
  // (this file's MLKEM768-X25519 suite), one per environment; the pin is its
  // version's xwing-raw-bytes public key. KMS never encapsulates: clients seal
  // to the pinned key. Decapsulate is granted to named humans only, never a
  // service account, so no service and no CI can open a custodian wrap; every
  // call is audit-logged and alerts (sem 2026-10-23, WDY-4007). The accepted
  // custodian key ids are config, not wire. The registry refuses a release or
  // deployment with no CUSTODIAN wrap. At secret scope no client ever makes a
  // CUSTODIAN wrap (WrapScope); the registry's refusal there is a tripwire.
  RECIPIENT_KIND_CUSTODIAN = 3;
}

// What a wrap opens. Deployment scope: the deployment key. Release scope: the
// content key itself, for release holders before any deployment exists (Q1).
// Secret scope: one secret version's key (WDY-4374). A client NEVER makes a
// CUSTODIAN wrap at the secret scope, whatever list of recipients it is given
// (a wrap helper that adds the custodian for releases and deployments must
// not add it here). AddWraps refusing one is a tripwire, not the guarantee. A
// client that finds a CUSTODIAN wrap at a secret scope treats that secret
// version as compromised: it refuses to use it (no wrap onward, never in a
// DeviceAssignment) and reports it to its operator.
message WrapScope {
  oneof scope {
    string deployment_id = 1;
    string app_release_id = 2;
    // "<app_id>/<name>/<version>", version in decimal from 1.
    string secret_version = 4;
  }
  // SHA-256 (hex) of the wrapped key; tells a stale wrap after rotation.
  string key_id = 3;
}

// One key sealed to one recipient public key (HPKE base mode). The HPKE info
// binds tenant, scope, key_id and recipient_key_id, so a wrap moved to another
// scope or recipient does not open. Info layout (AAD empty) and vectors:
// conformance/registry/README.md.
message KeyWrap {
  WrapScope scope = 1;
  RecipientKind recipient_kind = 2;
  string recipient = 3;         // SPIFFE URI; empty for the custodian
  string recipient_key_id = 4;  // SHA-256 (hex) of the recipient public key
  KemSuite suite = 5;
  bytes enc = 6;
  bytes ciphertext = 7;
}

// The content key sealed under a deployment key, once per deployment and
// deployment key: AES-256-GCM, 12-byte nonce, AAD length-prefixed over
// tenant, deployment_id, manifest_digest, content_key_id and
// deployment_key_id (conformance/registry/README.md).
// Q6: rotation changes the deployment key only. The rotating client seals the
// same content key under a new deployment key, re-wraps it to current members
// and re-assigns each device; blobs are not re-encrypted. A leaked content key
// means publishing a new release.
message SealedContentKey {
  string deployment_id = 1;
  string manifest_digest = 2;
  string content_key_id = 3;
  string deployment_key_id = 4;
  bytes nonce = 5;
  bytes ciphertext = 6;
}

message AddWrapsRequest {
  string organization_id = 1;
  repeated KeyWrap wraps = 2;
  repeated SealedContentKey sealed_content_keys = 3;  // deployment create and rotation
}

message AddWrapsResponse {
  uint32 stored = 1;
}

message RemoveWrapsRequest {
  string organization_id = 1;
  WrapScope scope = 2;
  repeated string recipient_key_ids = 3;
}

message RemoveWrapsResponse {
  uint32 removed = 1;
}

// ==================== Device side ====================

// Device-facing registry API over the device's own mTLS (tier A/B). Every call
// is refused unless a live assignment of this device references the deployment
// and the digest belongs to its release. When the assignment check cannot be
// made, the call is refused too (UNAVAILABLE): availability degrades, security
// does not (Q3).
service DeviceArtifactService {
  rpc GetDeploymentMaterial(GetDeploymentMaterialRequest) returns (GetDeploymentMaterialResponse);
  // Server stream of ciphertext, resumable by offset.
  rpc GetBlob(GetBlobRequest) returns (stream GetBlobResponse);
}

message GetDeploymentMaterialRequest {
  string deployment_id = 1;  // from the verified assignment
}

// The device's wrap is not here: it arrives in its signed DeviceAssignment.
message GetDeploymentMaterialResponse {
  ArtifactManifest manifest = 1;
  SealedContentKey sealed_content_key = 2;  // at the assignment's deployment_key_id
}

message GetBlobRequest {
  string deployment_id = 1;
  string ciphertext_digest = 2;
  uint64 offset = 3;
}

message GetBlobResponse {
  bytes data = 1;
}
