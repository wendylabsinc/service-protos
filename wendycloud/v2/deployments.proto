syntax = "proto3";

package wendycloud.v2;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "wendy/options.proto";
import "wendycloud/v2/signed_request.proto";

service DeploymentService {
  // ==================== App Releases ====================
  // Refused with FAILED_PRECONDITION while the app is being deleted
  // (App.deletion_started_at).
  // Signed; payload_type "wendycloud.v2.CreateAppReleaseRequest".
  rpc CreateAppRelease(SignedRequest) returns (AppRelease) {
    option (wendy.signed_request) = true;
  }
  // Signed; payload_type "wendycloud.v2.UpdateAppReleaseRequest".
  rpc UpdateAppRelease(SignedRequest) returns (AppRelease) {
    option (wendy.signed_request) = true;
  }
  rpc ListAppReleases(ListAppReleasesRequest) returns (stream ListAppReleasesResponse);

  // ==================== Deployments ====================
  // Signed; payload_type "wendycloud.v2.CreateDeploymentRequest".
  // Deprecated: use CreateDeploymentV2, which also returns the per-device
  // statements still to sign. Kept for clients that have not re-pinned; its
  // response type cannot change (wire-incompatible for them).
  rpc CreateDeployment(SignedRequest) returns (Deployment) {
    option (wendy.signed_request) = true;
  }
  // Creates a named, lasting deployment at revision 1. Not relayed to
  // devices: each device gets its own AssignDevice statement, which the client
  // signs from DeploymentChangeResponse.to_sign. Resource binding:
  // org/<org>/release/<app_release_id>, as for CreateDeployment. Refused with
  // FAILED_PRECONDITION while the app is being deleted.
  // Signed; payload_type "wendycloud.v2.CreateDeploymentRequest".
  rpc CreateDeploymentV2(SignedRequest) returns (DeploymentChangeResponse) {
    option (wendy.signed_request) = true;
  }
  rpc GetDeployment(GetDeploymentRequest) returns (Deployment);
  rpc ListDeployments(ListDeploymentsRequest) returns (stream ListDeploymentsResponse);
  // Update, roll back and remove each create exactly one revision, and are
  // refused with ABORTED unless expected_revision is the current revision.
  // They are refused with FAILED_PRECONDITION on a removed deployment, and
  // (like CreateDeployment/V2) while the app is being deleted
  // (App.deletion_started_at).
  // None of them is relayed to devices; the per-device statements in the
  // response are. Resource binding: org/<org>/deployment/<deployment_id>.
  // Signed; payload_type "wendycloud.v2.UpdateDeploymentRequest".
  rpc UpdateDeployment(SignedRequest) returns (DeploymentChangeResponse) {
    option (wendy.signed_request) = true;
  }
  // Refused with FAILED_PRECONDITION, naming the release, when to_revision's
  // release has been deleted since.
  // Signed; payload_type "wendycloud.v2.RollbackDeploymentRequest".
  rpc RollbackDeployment(SignedRequest) returns (DeploymentChangeResponse) {
    option (wendy.signed_request) = true;
  }
  // Its device statements are TERMINAL removals at the maximum revision
  // (UnassignDeviceRequest.revision); the history records the removal as
  // revision current + 1.
  // Signed; payload_type "wendycloud.v2.RemoveDeploymentRequest".
  rpc RemoveDeployment(SignedRequest) returns (DeploymentChangeResponse) {
    option (wendy.signed_request) = true;
  }
  // History, newest first, paginated. Each revision carries its selection and
  // device count; the device ids come from ListDeploymentRevisionDevices.
  rpc ListDeploymentRevisions(ListDeploymentRevisionsRequest) returns (ListDeploymentRevisionsResponse);
  // The resolved device set of one revision, paginated.
  rpc ListDeploymentRevisionDevices(ListDeploymentRevisionDevicesRequest) returns (ListDeploymentRevisionDevicesResponse);
  // The devices one revision moved in or out, paginated.
  rpc ListDeploymentRevisionMoves(ListDeploymentRevisionMovesRequest) returns (ListDeploymentRevisionMovesResponse);
  // The statements cloud still needs: the continuation of
  // DeploymentChangeResponse.to_sign, and how any operator who may make the
  // change resumes after an interruption, from any of their keys. Pending is
  // every device whose last statement cloud has received differs from the
  // current revision in content (release, configuration, desired state,
  // membership), not merely in revision number:
  // - a device in the current set: an Assign at the current revision;
  // - a device outside the current set that still holds an older revision,
  //   also one a superseded revision dropped before its removal was sent: an
  //   Unassign at the current revision;
  // - a removed deployment: its outstanding terminal removals (maximum
  //   revision);
  // - never a device whose move out of this deployment has been recorded:
  //   the move statement is its removal;
  // - by app_id, before an app delete starts and while it runs: every device
  //   in the app's removal set that still lacks its terminal removal, across
  //   the app's deployments (DeleteAppRequest.device_removals). A client
  //   reads this before it sends its first DeleteApp batch.
  rpc ListPendingDeviceStatements(ListPendingDeviceStatementsRequest) returns (ListPendingDeviceStatementsResponse);

  // ==================== Per-device statements ====================
  // Moved here from ArtifactRegistryService (orchestrator ruling D2): same
  // payload types and the same postbox relay; the deprecated originals stay
  // until every client and device has moved. The signed `operation` claim
  // names THIS method, so a device accepts both names for the same payload
  // type (conformance/postbox-entry/README.md). An agent that knows only the
  // old names refuses an entry signed for these, so devices are updated
  // before any client signs for them.
  //
  // One signed statement per target device, postbox-relayed verbatim to that
  // device: its authority to apply and its pull authorization. A move between
  // two deployments of one app is ONE statement (DeviceAssignment.replaces_*),
  // never an Unassign plus an Assign. The device's rules are on
  // DeviceAssignment in registry.proto. Refused with FAILED_PRECONDITION while
  // the app is being deleted (App.deletion_started_at).
  // Signed; payload_type "wendycloud.v2.DeviceAssignment".
  rpc AssignDevice(SignedRequest) returns (DeviceStatementResponse) {
    option (wendy.signed_request) = true;
  }
  // Postbox-relayed to the device; cloud drops the assignment, so pulls stop.
  // Used when a revision takes a device out of a deployment, when a
  // deployment is removed, and inside DeleteAppRequest.device_removals.
  // Cloud refuses one at the maximum revision outside RemoveDeployment and
  // DeleteApp, and a non-terminal one whose revision is not the deployment's
  // current revision.
  // Signed; payload_type "wendycloud.v2.UnassignDeviceRequest".
  rpc UnassignDevice(SignedRequest) returns (DeviceStatementResponse) {
    option (wendy.signed_request) = true;
  }

  // ==================== Asset App Desired Instructions (wendy-agent) ====================
  rpc HandleReportedState(stream UpdateReportedStateRequest) returns (stream DesiredStateResponse);
  rpc ListAssetApps(ListAssetAppsRequest) returns (ListAssetAppsResponse);
  // Every device's state of one app, report-only (unassigned) rows included
  // (WDY-4000): ListAssetApps across devices, for the app and rollout views.
  rpc ListAppDeviceStates(ListAppDeviceStatesRequest) returns (ListAppDeviceStatesResponse);

  // ==================== Device Container Control ====================
  rpc ListDeviceContainers(ListDeviceContainersRequest) returns (stream DeviceContainer);
  // Signed; payload_type "wendycloud.v2.ControlContainerRequest".
  rpc ControlContainer(SignedRequest) returns (ControlContainerResponse) {
    option (wendy.signed_request) = true;
  }
}

// ==================== App Releases ====================
message AppRelease {
  string id = 1;
  string organization_id = 2;
  string app_id = 3;
  string name = 4;
  string details = 5;
  // For a registry-backed release: ArtifactManifest.manifest_digest, set by
  // ArtifactRegistryService.PublishArtifact.
  optional string image_digest = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  ReleaseType release_type = 9;
  // The release's default configuration: the app section of the project's
  // wendy.json at publish, as CreateAppReleaseRequest carried it. Empty means
  // `{}`. Cloud-served and not signed by anyone the device trusts: the client
  // shows it as the starting point, and only the configuration the operator
  // then signs (DeviceAssignment.config_json) reaches a device.
  string default_config_json = 10;
}

message CreateAppReleaseRequest {
  string app_id = 1;
  string organization_id = 2;
  string name = 3;
  string details = 4;
  ReleaseType release_type = 5;
  // Set by the CLI from wendy.json at publish. One JSON object, UTF-8, at most
  // 64 KiB, stored verbatim. Empty means `{}`.
  string default_config_json = 6;
}

// Use this to assign a image_digest to an app_release after it has been pushed to the registry
// Note, verify that the image_digest exists in the registry before updating the app_release
message UpdateAppReleaseRequest {
  string id = 1;
  string name = 2;
  string details = 3;
  string image_digest = 4;
}

message ListAppReleasesRequest {
  string organization_id = 1;
  string app_id = 2;
  int32 offset = 3;
  int32 limit = 4;
}

message ListAppReleasesResponse {
  repeated AppRelease app_releases = 1;
  int32 total = 2;
  int32 offset = 3;
}

// ==================== Deployments ====================

message Deployment {
  string id = 1;
  string organization_id = 2;
  // Deprecated: never used for targeting.
  string jq_filter = 3;
  string app_release_id = 4;
  // Deprecated: the "why" is now a revision note (DeploymentRevision.note).
  // Cloud keeps filling it with revision 1's note.
  string details = 5;
  string created_by_user_id = 6;
  google.protobuf.Timestamp created_at = 7;
  // Both computed on read, never stored (WDY-3573).
  // target_count: devices with a fan-out row for this deployment (rows carry its deployment_id).
  // updated_count: of those, devices whose reported_release_id equals this deployment's
  // app_release_id, reported after the deployment was created (the reported_at fence).
  int32 target_count = 8;
  int32 updated_count = 9;
  // The targeting the deployment was created with (WDY-3576). Both empty: every device.
  repeated string target_tags = 10;
  repeated string target_device_ids = 11;
  // Named, lasting deployments with revisions (apps and deployments spec
  // section 3, sem 2026-11-12). A cloud that predates them leaves 12-18 unset:
  // revision 0, no name.
  // Chosen by the user; unique per app among live deployments.
  string name = 12;
  string app_id = 13;
  // The full effective configuration of the current revision: one JSON
  // object, UTF-8, at most 64 KiB, verbatim.
  string config_json = 14;
  // RUNNING, or STOPPED for "install only". Never ABSENT on a deployment that
  // has a revision.
  Running desired_state = 15;
  // The current revision, from 1.
  int32 revision = 16;
  // When the current revision was created.
  google.protobuf.Timestamp updated_at = 17;
  // Unset = live.
  google.protobuf.Timestamp removed_at = 18;
  // How long an offline device keeps trying to get the current revision: the
  // client sets each statement's expires_at to its signing time plus this.
  // Default 60 days (the tenant cap default), never above the tenant cap or
  // the platform cap of 1 year (conformance/postbox-entry/README.md).
  google.protobuf.Duration validity = 19;
}

// One recorded change to a deployment. Revisions are numbered from 1 and never
// rewritten; a rollback is a new revision that copies an earlier one.
message DeploymentRevision {
  string deployment_id = 1;
  int32 revision = 2;
  // Empty if that release was deleted since.
  string app_release_id = 3;
  // The resolved configuration text this revision's statements carry.
  string config_json = 4;
  Running desired_state = 5;
  // The size of the resolved device set. The ids: ListDeploymentRevisionDevices.
  int32 device_count = 6;
  // What the user selected the devices by.
  DeviceSelection selection = 7;
  string author_user_id = 8;
  string note = 9;
  google.protobuf.Timestamp created_at = 10;
  // 0 = not a rollback; otherwise the revision it restored.
  int32 rollback_of = 11;
  // How many devices this revision moved in from, or out to, another
  // deployment of the same app. The moves: ListDeploymentRevisionMoves.
  int32 move_count = 12;
  // This revision removed the deployment (RemoveDeployment). It is numbered
  // current + 1 here; its device statements carry the maximum revision
  // (terminal removal, UnassignDeviceRequest.revision).
  bool removed = 13;
  google.protobuf.Duration validity = 14;
}

message DeviceMove {
  string device_id = 1;
  string from_deployment_id = 2;
  string to_deployment_id = 3;
}

// infer the created_by_user_id from the authService
message CreateDeploymentRequest {
  string organization_id = 1;
  optional string jq_filter = 2;
  string app_release_id = 3;
  string details = 4;
  Running running = 5;
  // Targeting (WDY-3576). The deployment goes to the union of the devices that carry any of
  // target_tags (exact match) and the devices named in target_device_ids (UUIDs, each must
  // belong to the organization). Both empty: every device in the organization. The set is
  // resolved once, at create time; a device tagged later does not get the deployment. A
  // non-empty targeting that matches no device is refused with FAILED_PRECONDITION.
  repeated string target_tags = 6;
  repeated string target_device_ids = 7;
  // Instruction validity (WDY-4015 item 3, sem 2026-10-23 22:27), under the
  // operator's signature: required when cloud relays the request to a device
  // postbox. Rules: conformance/postbox-entry/README.md.
  google.protobuf.Timestamp valid_until = 8;
  // Fields 9-13 are read by CreateDeploymentV2. Under the operator's
  // signature; cloud checks them, and none of them reaches a device as is.
  // On CreateDeploymentV2, `running` (5) is the deployment's desired state and
  // must be RUNNING (run now) or STOPPED (install only); ABSENT is refused.
  // target_device_ids (7) holds at most 1000 ids; select larger sets by tag.
  // Required. Refused if empty, or if a live deployment of the app has it.
  string name = 9;
  // One JSON object, UTF-8, at most 64 KiB. Empty = the release's
  // default_config_json (`{}` when that is empty). Cloud stores the resolved
  // text; every statement of the revision carries that text verbatim.
  string config_json = 10;
  // Optional history note for revision 1.
  string note = 11;
  // The explicit choice to move devices that are already in another live
  // deployment of this app. When false, cloud refuses the request, and the
  // refusal names the device and the deployment.
  bool move_devices = 12;
  // Deployment.validity. Unset = 60 days.
  google.protobuf.Duration validity = 13;
}

// The full new device set of a deployment.
message DeviceSelection {
  repeated string target_tags = 1;
  // Asset UUIDs, at most 1000. A selection with both lists empty is refused;
  // it never means "every device".
  repeated string target_device_ids = 2;
}

message UpdateDeploymentRequest {
  string organization_id = 1;
  string deployment_id = 2;
  int32 expected_revision = 3;
  // Unset = unchanged.
  optional string app_release_id = 4;
  // Unset = keep the deployment's current configuration text unchanged, also
  // when the release changes. To use the new release's defaults, the client
  // sends that text. Set = the full new text: one JSON object, at most 64 KiB.
  optional string config_json = 5;
  // Start (RUNNING) or stop (STOPPED). Unset = unchanged; ABSENT is refused.
  optional Running desired_state = 6;
  // Unset = unchanged; set = the full new set.
  DeviceSelection devices = 7;
  string note = 8;
  bool move_devices = 9;
  // Unset = unchanged.
  google.protobuf.Duration validity = 10;
}

message RollbackDeploymentRequest {
  string organization_id = 1;
  string deployment_id = 2;
  int32 expected_revision = 3;
  // The new revision copies this one's release, configuration, desired state
  // and devices.
  int32 to_revision = 4;
  string note = 5;
  bool move_devices = 6;
  // Unset = to_revision's validity.
  google.protobuf.Duration validity = 7;
}

message RemoveDeploymentRequest {
  string organization_id = 1;
  string deployment_id = 2;
  int32 expected_revision = 3;
  string note = 4;
}

// What the change recorded, and the per-device statements the client must
// still sign and send (AssignDevice / UnassignDevice). Cloud never signs;
// until a device's statement arrives it shows as "waiting".
message DeploymentChangeResponse {
  Deployment deployment = 1;
  DeploymentRevision revision = 2;
  // At most 500. The rest: ListPendingDeviceStatements with next_page_token.
  repeated PendingDeviceStatement to_sign = 3;
  // Empty = to_sign is complete.
  string next_page_token = 4;
}

// Cloud-asserted, so it is a to-do list, not authority. The client builds and
// signs each statement only from the change its operator confirmed (release,
// configuration and desired state of that revision, and a device the operator
// saw in the device set) and refuses an entry that does not match it. It also
// refuses a revision other than its own expected_revision + 1 (1 on create),
// or, when resuming, the current revision whose content it showed the
// operator; except the maximum revision on a KIND_UNASSIGN of a
// RemoveDeployment or DeleteApp (terminal removal), which it requires there
// and refuses anywhere else. It accepts replaces_* only when the operator set
// move_devices and confirmed that device as being in that deployment of the
// same app.
message PendingDeviceStatement {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_ASSIGN = 1;
    // A device leaving the deployment, or the deployment being removed. Never
    // used for a move: a move is one KIND_ASSIGN with replaces_* set.
    KIND_UNASSIGN = 2;
  }
  Kind kind = 1;
  string deployment_id = 2;
  // The device's SPIFFE URI.
  string device = 3;
  // The revision the statement must carry.
  int32 revision = 4;
  // KIND_ASSIGN for a move only: the other deployment of the same app the
  // device leaves, and that deployment's current revision once the move is
  // recorded (DeviceAssignment.replaces_revision). Copied into
  // DeviceAssignment.replaces_deployment_id / replaces_revision.
  string replaces_deployment_id = 5;
  int32 replaces_revision = 6;
}

message ListDeploymentRevisionsRequest {
  string deployment_id = 1;
  // 0 = 20. The server caps it at 50.
  int32 page_size = 2;
  // next_page_token of the previous page; empty = the first page.
  string page_token = 3;
}

message ListDeploymentRevisionsResponse {
  // Newest first.
  repeated DeploymentRevision revisions = 1;
  // Empty = the last page.
  string next_page_token = 2;
}

message ListDeploymentRevisionDevicesRequest {
  string deployment_id = 1;
  int32 revision = 2;
  // 0 = 100. The server caps it at 500.
  int32 page_size = 3;
  // next_page_token of the previous page; empty = the first page.
  string page_token = 4;
}

message ListDeploymentRevisionDevicesResponse {
  // Asset UUIDs, ordered.
  repeated string device_ids = 1;
  // Empty = the last page.
  string next_page_token = 2;
}

message ListPendingDeviceStatementsRequest {
  // Exactly one of deployment_id and app_id. app_id: the terminal removals an
  // app delete still lacks across the app's deployments, before the delete
  // starts and while it runs.
  string deployment_id = 1;
  // 0 = 500. The server caps it at 500.
  int32 page_size = 2;
  // next_page_token of the previous page (or of DeploymentChangeResponse);
  // empty = the first page.
  string page_token = 3;
  string app_id = 4;
}

message ListDeploymentRevisionMovesRequest {
  string deployment_id = 1;
  int32 revision = 2;
  // 0 = 100. The server caps it at 500.
  int32 page_size = 3;
  // next_page_token of the previous page; empty = the first page.
  string page_token = 4;
}

message ListDeploymentRevisionMovesResponse {
  repeated DeviceMove moves = 1;
  // Empty = the last page.
  string next_page_token = 2;
}

message ListPendingDeviceStatementsResponse {
  repeated PendingDeviceStatement statements = 1;
  // Empty = the last page.
  string next_page_token = 2;
}

// What AssignDevice and UnassignDevice return on DeploymentService. Same wire
// shape as the deprecated AssignDeviceResponse and UnassignDeviceResponse.
message DeviceStatementResponse {
  int64 postbox_entry_id = 1;
}

message GetDeploymentRequest {
  string id = 1;
}

message ListDeploymentsRequest {
  string organization_id = 1;
  // Empty = every app (the Deployments page lists all, grouped by app).
  string app_id = 2;
  int32 offset = 3;
  int32 limit = 4;
  // Also return removed deployments. Default: live only.
  bool include_removed = 5;
}

message ListDeploymentsResponse {
  repeated Deployment deployments = 1;
  int32 total = 2;
}

// ==================== Asset App Desired Instructions (wendy-agent) ====================

// this is to be called by the wendy-agent to update the reported state of an apps on an asset
// asset_id and organization_id are derived from the client certificate
message UpdateReportedStateRequest {
  repeated CurrentState current_states = 1;
}

message CurrentState {
  string app_id = 1;
  optional string app_release_id = 2;
  Running reported_state = 3;
  int32 reported_restart_count = 4;
  uint32 reported_last_exit_signal = 5;
  // The postbox entry this state answers, so cloud can tell which signed
  // request a device applied or refused, and why.
  int64 postbox_entry_id = 6;
  string correlation_id = 7;
  string manifest_digest = 8;
  ApplyOutcome outcome = 9;
}

enum ApplyOutcome {
  APPLY_OUTCOME_UNSPECIFIED = 0;
  APPLY_OUTCOME_APPLIED = 1;
  APPLY_OUTCOME_REJECTED_SIGNATURE = 2;
  APPLY_OUTCOME_REJECTED_TARGET = 3;
  APPLY_OUTCOME_REJECTED_STALE = 4;
  APPLY_OUTCOME_REJECTED_DIGEST = 5;
  APPLY_OUTCOME_REJECTED_UNWRAP = 6;
  APPLY_OUTCOME_PULL_REFUSED = 7;
  APPLY_OUTCOME_SUPERSEDED = 8;
  // The entry passed every verification check, but the device failed to carry
  // it out (e.g. the container did not start). Never reported as a
  // REJECTED_* value: those mean the device refused the entry itself. The
  // failure reason stays in the device's audit log.
  APPLY_OUTCOME_APPLY_FAILED = 9;
  // The entry passed its signature, target and freshness checks, and the
  // device is actively downloading or decrypting the release. The digest and
  // unwrap checks run during the pull. Not final: the device reports the same
  // entry again with APPLIED (install only), NOT_STARTED, PULL_REFUSED,
  // REJECTED_DIGEST, REJECTED_UNWRAP, APPLY_FAILED or SUPERSEDED, or with
  // PULL_RETRYING while it cannot pull. Not a failure.
  APPLY_OUTCOME_PULLING = 10;
  // The device pulled and imported the release for an entry whose desired
  // state is running, and has not started the app. Not APPLIED: a running
  // entry counts as applied only once the app runs. An install-only entry
  // (desired state stopped) reports APPLIED once imported, never this value.
  // Not APPLY_FAILED: nothing went wrong. Not final: the device reports the
  // same entry again as APPLIED once the app runs, or APPLY_FAILED if
  // starting it fails.
  APPLY_OUTCOME_NOT_STARTED = 11;
  // The entry passed its signature, target and freshness checks, but the
  // device cannot pull the release right now and is retrying: the registry
  // is unreachable or answers that it is temporarily unavailable. Not final:
  // the device reports PULLING when it starts pulling again, then ends in the
  // same values as PULLING. If the entry's validity ends while it is still
  // retrying, the device reports PULL_REFUSED. The reason stays in the
  // device's log and audit trail, not on the wire.
  APPLY_OUTCOME_PULL_RETRYING = 12;
}

// this is to be called by the wendy-agent to get the desired state of an app on an asset
// if the app_id does not exist, wendy-agent should remove the container from the asset
message DesiredStateResponse {
  repeated DesiredAppState desired_app_states = 1;
  optional google.protobuf.Timestamp cert_expires_at = 2;
  // Postbox nudge (sem 2026-10-15, postbox client section approved): the
  // device's postbox holds entries up to this id. It carries no authority: the
  // device runs its normal DevicePostboxService.PullChanges and verifies every
  // entry; a forged or spurious nudge only triggers a pull that finds nothing
  // new. Unset = no nudge; timer polling stays the fallback while the stream is
  // down. Cloud sets it only on a message that also carries the complete
  // desired_app_states, never on a nudge-only message: an agent that ignores
  // this field reads an empty list as "remove every app".
  optional int64 postbox_head_entry_id = 3;
}

message DesiredAppState {
  string app_id = 1;
  optional string app_release_id = 2;
  Running desired_state = 3;
  optional string image_digest = 4;
  ReleaseType release_type = 5;
}

enum Running {
  ABSENT = 0;
  RUNNING = 1;
  STOPPED = 2;
}

enum ReleaseType {
  CONTAINER = 0;
  WASM = 1;
  CONFIG = 2;
  // No FIRMWARE: tier C (wendy-lite) firmware is not OCI and gets its own shape
  // (sem 2026-10-18 16:37). TODO(tier C): add with that contract.
}

// ==================== List Asset Apps ====================
message ListAssetAppsRequest {
  string asset_id = 1;
  string organization_id = 2;
}

message AssetApp {
  string app_id = 1;
  string app_name = 2;
  optional string app_release_id = 3;
  optional string app_release_name = 4;
  Running desired_state = 5;
  optional Running reported_state = 6;
  optional google.protobuf.Timestamp reported_at = 7;
  optional int32 reported_restart_count = 8;
  // The deployment this device's row belongs to. A device holds at most one
  // live deployment of an app. (Before lasting deployments: the most recent
  // deployment that targeted this app release in the org.)
  optional string deployment_id = 9;
  optional string deployment_details = 10;
  optional google.protobuf.Timestamp deployment_created_at = 11;
  ReleaseType release_type = 12;
  // Reported state v2 (apps spec section 2, approved sem 2026-10-15): the
  // device's own word from its latest CurrentState for this app, stored next to
  // the desired state. Facts under the device's cert, no authority; unset or
  // zero = the device has not reported it. Freshness is reported_at (7): a
  // stale report is shown as stale, never as current truth.
  int64 postbox_entry_id = 13;
  string correlation_id = 14;
  string manifest_digest = 15;
  ApplyOutcome outcome = 16;
  // True: cloud holds no desired state for this app on this device; the row
  // exists only because the device reported the app (unassigned but running,
  // e.g. a direct push with recording off, WDY-3207). Reporting is unconditional
  // on an enrolled device, so such an app is shown, never hidden. desired_state
  // (5) is meaningless when true, and the row is never an assignment. False is
  // the default, so a cloud that predates this field reads as "assigned", which
  // every row it serves is.
  bool unassigned = 17;
  // The release the device reported running, when it named a release of this
  // app; app_release_id (3) stays the desired release.
  optional string reported_release_id = 18;
  // Whether the device has been told the deployment's current revision, for
  // one list that shows per device what it should run next to what it
  // reports. Both are cloud-asserted display information: nothing a device
  // acts on, and no authority (the device acts only on signed statements).
  // Also returned per deployment, through ListAppDeviceStates
  // (AppDeviceState.state).
  // - deployment_revision: the current revision of deployment_id (9).
  // - delivered_revision: the revision of the last statement for that
  //   deployment delivered to this device (a terminal removal counts as the
  //   maximum revision); 0 when none.
  // delivered_revision below deployment_revision = not told yet: the device
  // is waiting for its instruction. Both are 0 for an app the device runs
  // without a deployment (run directly, or only reported: unassigned (17)),
  // and from a cloud that predates them.
  int32 deployment_revision = 19;
  int32 delivered_revision = 20;
}

message ListAssetAppsResponse {
  repeated AssetApp asset_apps = 1;
}

// ==================== List App Device States ====================
message ListAppDeviceStatesRequest {
  string organization_id = 1;
  string app_id = 2;
  // At most this many rows; 0 = the server default. The server caps it.
  int32 page_size = 3;
  // next_page_token of the previous page; empty = the first page.
  string page_token = 4;
  // When set, only the devices of this deployment of the app (desired next to
  // reported), for the deployment details page.
  string deployment_id = 5;
}

// One device's row for the app: the AssetApp ListAssetApps returns for that
// device, and which device it is.
message AppDeviceState {
  string asset_id = 1;
  string asset_name = 2;
  AssetApp state = 3;
}

message ListAppDeviceStatesResponse {
  // Ordered by asset_id. Only devices the caller may see: a hidden device is
  // absent, and nothing counts it.
  repeated AppDeviceState rows = 1;
  // Empty = the last page.
  string next_page_token = 2;
}

// ==================== Device Container Control ====================

message ListDeviceContainersRequest {
  string asset_id = 1;
  string organization_id = 2;
}

message DeviceContainer {
  string app_name = 1;
  string app_version = 2;
  AppRunningState running_state = 3;
  uint32 failure_count = 4;
  repeated DeviceService services = 5;
}

message DeviceService {
  string name = 1;
  AppRunningState running_state = 2;
}

enum AppRunningState {
  APP_RUNNING_STATE_UNSPECIFIED = 0;
  APP_RUNNING_STATE_STOPPED = 1;
  APP_RUNNING_STATE_RUNNING = 2;
}

message ControlContainerRequest {
  string asset_id = 1;
  string organization_id = 2;
  // "myapp" for whole app; "myapp.web" for one service container
  string container_name = 3;
  ContainerAction action = 4;
  // Instruction validity (WDY-4015 item 3, sem 2026-10-23 22:27), under the
  // operator's signature: required when cloud relays the request to a device
  // postbox. Rules: conformance/postbox-entry/README.md.
  google.protobuf.Timestamp valid_until = 5;
}

enum ContainerAction {
  CONTAINER_ACTION_UNSPECIFIED = 0;
  CONTAINER_ACTION_START = 1;
  CONTAINER_ACTION_STOP = 2;
}

message ControlContainerResponse {
  optional string warning = 1;
}
