syntax = "proto3";

package wendycloud.v2;

import "google/protobuf/timestamp.proto";
import "wendy/options.proto";
import "wendycloud/v2/signed_request.proto";

service OrganizationService {
  rpc CreateOrganization(CreateOrganizationRequest) returns (Organization);
  rpc GetOrganization(GetOrganizationRequest) returns (Organization);
  // Signed; payload_type "wendycloud.v2.UpdateOrganizationRequest".
  rpc UpdateOrganization(SignedRequest) returns (Organization) {
    option (wendy.signed_request) = true;
  }
  rpc DeleteOrganization(DeleteOrganizationRequest) returns (DeleteOrganizationResponse);
  rpc ListOrganizations(ListOrganizationsRequest) returns (stream ListOrganizationsResponse);

  // Signed; payload_type "wendycloud.v2.AddMemberRequest".
  rpc AddMember(SignedRequest) returns (OrganizationMember) {
    option (wendy.signed_request) = true;
  }
  // Signed; payload_type "wendycloud.v2.AddMembersByEmailsRequest".
  rpc AddMembersByEmails(SignedRequest) returns (AddMembersByEmailsResponse) {
    option (wendy.signed_request) = true;
  }
  // Signed; payload_type "wendycloud.v2.UpdateMemberRoleRequest".
  rpc UpdateMemberRole(SignedRequest) returns (OrganizationMember) {
    option (wendy.signed_request) = true;
  }
  // Signed; payload_type "wendycloud.v2.RemoveMemberRequest".
  rpc RemoveMember(SignedRequest) returns (RemoveMemberResponse) {
    option (wendy.signed_request) = true;
  }
  // Revokes all of a member's credentials and keeps the membership (WDY-3409):
  // every live pki-core certificate of the member's operator principal
  // (PKIAdminService.RevokePrincipalCertificates semantics) and every wendy-auth
  // session and refresh token in the organization's realm (fabric
  // ForceSignOut). Gate: `member:revoke-credentials`. Carries cloud's request
  // signature and the operator's pki-core management request (op
  // "revoke_principal"); cloud also attests `pki:cert-revoke`. Certificates are
  // revoked first; on a later failure the call fails and a retry with a fresh
  // management request completes it.
  // Signed; payload_type "wendycloud.v2.RevokeAllCredentialsRequest".
  rpc RevokeAllCredentials(SignedRequest) returns (RevokeAllCredentialsResponse) {
    option (wendy.signed_request) = true;
  }
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse);
  // Signed; payload_type "wendycloud.v2.TransferOwnershipRequest".
  rpc TransferOwnership(SignedRequest) returns (TransferOwnershipResponse) {
    option (wendy.signed_request) = true;
  }
  // Sets the role a new member receives when no role is named (IdP sign-in, AddMember without a
  // role, an invite created without one) and whether a group mapping replaces it (WDY-3877).
  // Gate: `member:set-role`. The default never applies to the adopting owner or to service
  // accounts. Read back through GetOrganization.
  //
  // The default is a pair (WDY-4052): an organization role (default_role_id) and a device role
  // (default_device_role_id), both bound at organization scope. Every new member receives the
  // device role, whatever organization role they join with, unless a group mapping replaced the
  // default at join (skip_default_when_group_mapped); the adopting owner holds Device manager
  // through ownership instead. Changing either half does not affect current members.
  // Signed; payload_type "wendycloud.v2.SetMemberDefaultsRequest".
  rpc SetMemberDefaults(SignedRequest) returns (Organization) {
    option (wendy.signed_request) = true;
  }
}

// Deprecated: use role_ids for notification audiences and role_id for assignments.
// Retained as the wire-compatible type of NotificationAudience.roles.
// Kept for wire compatibility; never remove or renumber its values.
enum OrganizationRole {
  option deprecated = true;

  ORGANIZATION_ROLE_UNSPECIFIED = 0;
  ORGANIZATION_ROLE_OWNER = 1;
  ORGANIZATION_ROLE_ADMIN = 2;
  ORGANIZATION_ROLE_BILLING_MANAGER = 3;
  ORGANIZATION_ROLE_MEMBER = 4;
  ORGANIZATION_ROLE_VIEWER = 5;
}

message Organization {
  string id = 1;
  string name = 2;
  string details = 3;
  optional string domain = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
  optional string user_id = 7;
  optional string slug = 8;
  // The role a new member receives when none is named (WDY-3877). Empty means "No role": the
  // member has only what group mappings give them. Filled by GetOrganization.
  string default_role_id = 9;
  // When true, a member whose realm groups match a group mapping of this organization at join
  // gets no role of their own (role_source "none"); the mapping decides. Filled by
  // GetOrganization.
  bool skip_default_when_group_mapped = 10;
  // The device role every new member receives at organization scope next to default_role_id
  // (WDY-4052). Empty means none: the member reaches no device until someone binds a device
  // role. New organizations start at Device manager. Filled by GetOrganization.
  string default_device_role_id = 11;
}

message OrganizationMember {
  string id = 1;
  string organization_id = 2;
  string user_id = 3;
  // Mirrors role_id for built-in roles; UNSPECIFIED for a tenant role.
  OrganizationRole role = 4 [deprecated = true];
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
  // The member's own role. Empty exactly when role_source is "none".
  string role_id = 7;
  // The member's wendy-auth subject (`sub`) under this organization's realm issuer: the
  // operator name in the member's SPIFFE ID, which a RevokeAllCredentials request names
  // (WDY-3442). Empty when the member has no identity, or more than one, under that realm.
  string subject = 8;
  // Where the member's own role came from (WDY-3877): "explicit" (named by an admin, an invite,
  // or ownership), "default" (the organization default at join; group-mapped roles add to it),
  // or "none" (no role of its own; group mappings alone decide).
  string role_source = 9;
  // ListMembers only (WDY-3895): distinct compute devices covered by this member's device-access
  // rules, including group grants and deny precedence. Roles still govern allowed actions.
  // Present zero means no devices; absent means unavailable, including older servers,
  // unresolved realm membership, or a viewer without device-access:list or full fleet access.
  // Uses the caller's token groups for self; current auth directory groups for other members.
  optional int32 device_access_count = 10;
}

message CreateOrganizationRequest {
  string name = 1;
  string details = 2;
  optional string domain = 3;
}

message GetOrganizationRequest {
  string id = 1;
}

message UpdateOrganizationRequest {
  string id = 1;
  optional string name = 2;
  optional string details = 3;
  optional string domain = 4;
  optional string slug = 5;
}

message DeleteOrganizationRequest {
  string id = 1;
}

message DeleteOrganizationResponse {
  bool success = 1;
}

message ListOrganizationsRequest {
  optional int32 offset = 1;
  optional int32 limit = 2;
  // Free-text search over organization name and domain, case-insensitive
  // substring match. Empty or unset returns the unfiltered list. Applied
  // server-side before offset/limit, so it searches every organization the
  // caller can see rather than only the current page.
  optional string query = 3;
}

message ListOrganizationsResponse {
  Organization organization = 1;
  int32 total = 2;
}

message AddMemberRequest {
  string organization_id = 1;
  string user_id = 2;
  // UNSPECIFIED with no role_id assigns the organization's default role (WDY-3877).
  OrganizationRole role = 3 [deprecated = true];
  // Wins over role when set.
  optional string role_id = 4;
}

message UpdateMemberRoleRequest {
  string user_id = 1;
  string organization_id = 2;
  OrganizationRole role = 3 [deprecated = true];
  // Wins over role when set.
  optional string role_id = 4;
}

message RemoveMemberRequest {
  string organization_id = 1;
  string user_id = 2;
}

message RemoveMemberResponse {
  bool success = 1;
}

message RevokeAllCredentialsRequest {
  string organization_id = 1;
  string user_id = 2;
}

message RevokeAllCredentialsResponse {}

message ListMembersRequest {
  string organization_id = 1;
}

message ListMembersResponse {
  repeated OrganizationMember members = 1;
}

message EmailWithRole {
  string email = 1;
  // UNSPECIFIED with no role_id assigns the organization's default role (WDY-3877).
  OrganizationRole role = 2 [deprecated = true];
  // Wins over role when set.
  optional string role_id = 3;
}

message AddMembersByEmailsRequest {
  string organization_id = 1;
  repeated EmailWithRole members = 2;
}

message AddMemberResult {
  string email = 1;
  bool success = 2;
  string error = 3;
  OrganizationMember member = 4;
}

message AddMembersByEmailsResponse {
  repeated AddMemberResult results = 1;
}

message SetMemberDefaultsRequest {
  string organization_id = 1;
  // The new default role: a built-in role or one of this organization's own, never owner, never
  // a role carrying member, invite, role, permission, group or group-mapping management, within
  // the built-in admin role, and held in full by the caller. Ignored when clear_default is true.
  optional string default_role_id = 2;
  // Sets the default to "No role".
  bool clear_default = 3;
  bool skip_default_when_group_mapped = 4;
  // The new default device role: a device-kind role, built-in or one of this organization's own,
  // held in full by the caller. Absent with clear_device_default false leaves the device default
  // unchanged (older consoles send neither). Ignored when clear_device_default is true.
  optional string default_device_role_id = 5;
  // Sets the default device role to none.
  bool clear_device_default = 6;
}

message TransferOwnershipRequest {
  string organization_id = 1;
  string new_owner_user_id = 2;
}

message TransferOwnershipResponse {
  OrganizationMember new_owner = 1;
  OrganizationMember previous_owner = 2;
}
