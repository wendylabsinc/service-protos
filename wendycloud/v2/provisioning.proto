syntax = "proto3";

package wendycloud.v2;

import "google/protobuf/timestamp.proto";

// OrganizationProvisioningService answers "is my organization ready to use, and if not, is it
// still coming" -- the readiness signal WDY-2718 R1 requires so the first sign-in does not have
// to block on pki tenant provisioning.
//
// Cloud-owned and deliberately outside the shared service-protos submodule, for the reason
// OrganizationInviteService gives in its own header: this contract is cloud's alone. The state
// it reports lives only in cloud's `organizations` table (migration 000076) and no other
// service reads or writes it, so putting it in the shared module would publish a contract
// nobody else participates in.
//
// POLL, not stream (sem's ruling). Every RPC here is unary and the client re-asks. A stream
// would hold a connection open for a wait that is normally over in seconds and, when it is
// not, is measured in minutes of backoff -- and it would have to survive the broker redeploy
// that a poll simply rides through.
//
// NEITHER RPC TAKES AN ARGUMENT, and that is the security property, not a convenience. Since
// WDY-2808 `organizations.id` IS the tenant uuid, so the caller's own `tenant_uuid` claim names
// the organization completely. There is no id on the wire to point at another tenant.
service OrganizationProvisioningService {
  // The caller's organization's provisioning state. Safe to poll.
  rpc GetProvisioningStatus(GetProvisioningStatusRequest) returns (ProvisioningStatus);

  // Puts a `terminal` organization back on the retry schedule and returns the resulting state.
  //
  // This exists so the wait screen's retry affordance actually binds. A terminal state means
  // the driver has stopped selecting the row -- either the attempt budget is spent or the
  // failure was classified as one no retry can fix -- so without this RPC a retry button would
  // re-poll an unchanging row and change nothing.
  //
  // It is honest for both kinds of terminal. A budget spent on a transient outage retries and
  // may well succeed; a genuinely permanent failure is re-classified terminal by the very next
  // attempt, so the state visibly returns rather than the caller being told a comforting lie.
  // An organization that is already provisioned is never knocked back into pending.
  rpc RetryProvisioning(RetryProvisioningRequest) returns (ProvisioningStatus);
}

// Deliberately an empty message rather than google.protobuf.Empty: a request type that is its
// own message can gain a field later without breaking the wire, and MeshRosterService sets the
// same precedent for an argument-free cloud RPC.
message GetProvisioningStatusRequest {}

message RetryProvisioningRequest {}

enum ProvisioningState {
  // No provisioning row: it has never been attempted for this organization.
  PROVISIONING_STATE_UNSPECIFIED = 0;
  // An attempt is in flight or scheduled. Keep polling.
  PROVISIONING_STATE_PENDING = 1;
  // The certificate authorities exist. Terminal in the good direction.
  PROVISIONING_STATE_COMPLETE = 2;
  // Provisioning will not be retried on its own. RetryProvisioning is the way out.
  PROVISIONING_STATE_TERMINAL = 3;
}

message ProvisioningStatus {
  ProvisioningState state = 1;

  // Attempts made so far, counted as each one begins. Reported so a wait screen can say
  // something truthful about a long wait instead of spinning identically forever.
  uint32 attempts = 2;

  // When the driver will try again. Absent when an attempt is in flight, and when the state is
  // complete or terminal.
  google.protobuf.Timestamp next_retry_at = 3;

  // NOTE ON WHAT IS DELIBERATELY NOT HERE: the stored `pki_provisioning_last_error`. It is a
  // raw internal failure string -- fabric errors, slugs, tenant uuids -- and this response is
  // read by a browser. Operators get it from the row and the logs, where it is already
  // recorded; the signed-in user gets a state and, on terminal, the retry-or-contact-support
  // path. Putting it on the wire would be an information-disclosure surface bought for copy
  // nobody wants to read.
}
