syntax = "proto3";

package wendycloud.v2;

import "google/protobuf/timestamp.proto";

// BillingService is Cloud-owned, defined in this repo (cloud-proto/, not the shared
// service-protos submodule) for the same reason OrganizationInviteService is: it is cloud's own
// per-organization surface, read only by the console, with no reason to be a cross-repo contract.
//
// Reads only (WDY-3569). Nothing is billed yet: the plan names are mock tiers, no field states an
// included quantity, a seat count or a limit, and there are no invoices. Two subscriptions, Cloud
// and BI, kept separate. The manage call (a Stripe-hosted portal session, billing:manage) arrives
// with WDY-2521; enabling and disabling BI with WDY-3570.
service BillingService {
  // billing:read.
  rpc GetBilling(GetBillingRequest) returns (Billing);
  // billing:read. Newest first. Always empty until invoices exist (WDY-2521).
  rpc ListInvoices(ListInvoicesRequest) returns (ListInvoicesResponse);
}

message GetBillingRequest {
  string organization_id = 1;
}

message Billing {
  Subscription cloud = 1;
  Subscription bi = 2;
}

message Subscription {
  // A tier name only, e.g. "Team". It carries no included quantities. Empty with no plan.
  string plan_name = 1;
  SubscriptionStatus status = 2;
  // Unset until a billing period exists.
  google.protobuf.Timestamp renews_at = 3;
  // Unset until a billing period exists.
  optional BillingInterval billed = 4;
  // Counts as of now, with no limit attached. Empty when cloud cannot count the product's usage.
  repeated Usage usage = 5;
}

enum SubscriptionStatus {
  SUBSCRIPTION_STATUS_UNSPECIFIED = 0;
  SUBSCRIPTION_STATUS_NONE = 1;
  SUBSCRIPTION_STATUS_TRIALING = 2;
  SUBSCRIPTION_STATUS_ACTIVE = 3;
  SUBSCRIPTION_STATUS_PAST_DUE = 4;
  SUBSCRIPTION_STATUS_CANCELED = 5;
  // The product cannot be subscribed to yet. BI until its enable callback ships (WDY-3570).
  SUBSCRIPTION_STATUS_NOT_ENABLED = 6;
}

enum BillingInterval {
  BILLING_INTERVAL_UNSPECIFIED = 0;
  BILLING_INTERVAL_MONTH = 1;
  BILLING_INTERVAL_YEAR = 2;
}

message Usage {
  UsageMetric metric = 1;
  uint32 count = 2;
}

enum UsageMetric {
  USAGE_METRIC_UNSPECIFIED = 0;
  // Compute devices in the organization.
  USAGE_METRIC_DEVICES = 1;
  // Organization memberships.
  USAGE_METRIC_MEMBERS = 2;
}

message ListInvoicesRequest {
  string organization_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListInvoicesResponse {
  repeated Invoice invoices = 1;
  string next_page_token = 2;
}

message Invoice {
  string number = 1;
  google.protobuf.Timestamp issued_at = 2;
  // In the currency's minor unit (cents for EUR).
  int64 total_minor = 3;
  // ISO 4217, e.g. "EUR".
  string currency = 4;
  InvoiceStatus status = 5;
  // The invoice page the payment provider hosts.
  string hosted_url = 6;
}

enum InvoiceStatus {
  INVOICE_STATUS_UNSPECIFIED = 0;
  INVOICE_STATUS_DRAFT = 1;
  INVOICE_STATUS_OPEN = 2;
  INVOICE_STATUS_PAID = 3;
  INVOICE_STATUS_VOID = 4;
  INVOICE_STATUS_UNCOLLECTIBLE = 5;
}
