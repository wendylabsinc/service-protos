syntax = "proto3";

package wendycloud.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

service ScheduleService {
  rpc CreateSlot(CreateSlotRequest) returns (Slot);
  rpc GetSlot(GetSlotRequest) returns (Slot);
  rpc ListSlots(ListSlotsRequest) returns (stream ListSlotsResponse);
  rpc AssignSlot(AssignSlotRequest) returns (Slot);
  rpc ClearSlot(ClearSlotRequest) returns (Slot);
  rpc DeleteSlot(DeleteSlotRequest) returns (google.protobuf.Empty);
}

// A schedule slot books a robot for a window of time, optionally assigned to a
// team. status is one of: available, assigned, completed.
message Slot {
  int32 id = 1;
  int32 organization_id = 2;
  // 0 means unassigned.
  optional int32 team_id = 3;
  int32 robot_id = 4;
  google.protobuf.Timestamp starts_at = 5;
  google.protobuf.Timestamp ends_at = 6;
  string status = 7;
  optional string created_by_user_id = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

message CreateSlotRequest {
  int32 organization_id = 1;
  int32 robot_id = 2;
  // When set, the slot is created as assigned to this team; otherwise available.
  optional int32 team_id = 3;
  google.protobuf.Timestamp starts_at = 4;
  google.protobuf.Timestamp ends_at = 5;
}

message GetSlotRequest {
  int32 id = 1;
  int32 organization_id = 2;
}

message ListSlotsRequest {
  int32 organization_id = 1;
}

message ListSlotsResponse {
  Slot slot = 1;
}

message AssignSlotRequest {
  int32 slot_id = 1;
  int32 team_id = 2;
  int32 organization_id = 3;
}

message ClearSlotRequest {
  int32 id = 1;
  int32 organization_id = 2;
}

message DeleteSlotRequest {
  int32 id = 1;
  int32 organization_id = 2;
}
