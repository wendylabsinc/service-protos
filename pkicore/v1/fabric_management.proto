// proto/pkicore/v1/fabric_management.proto
syntax = "proto3";
package pkicore.v1;
option go_package = "github.com/wendylabsinc/service-protos/pkicore/v1;pkicorev1";
import "wendyauth/v1/envelope.proto";
import "pkicore/v1/types.proto";
import "pkicore/v1/engine.proto";
import "pkicore/v1/fabric_relay.proto";

// FabricManagementService is the pki-core-authored receiver for the retired
// Admin REST API's tenant-scoped management surface (AAA W20), hosted on the
// private-only fabric server alongside FabricRelayService/SecurityEventService.
// Authority is per-operation: tier-1 ops trust the transport-authenticated
// caller + envelope tenant; tier-3 ops carry an operator-signed request
// (signed_artifact kind "management-request+jws") re-verified at the edge (D7).
service FabricManagementService {
  // -- tier 1: transport authority (no signed_artifact) --
  rpc ListCAs(wendyauth.v1.Envelope)               returns (ListCAsResponse);
  rpc GetCAChain(wendyauth.v1.Envelope)            returns (GetCAChainResponse);       // payload = GetCAChainRequest
  rpc GetTenantPolicy(wendyauth.v1.Envelope)       returns (GetTenantPolicyResponse);
  rpc ListEABKeys(wendyauth.v1.Envelope)           returns (ListEABKeysResponse);      // payload = ListEABKeysRequest
  rpc ListEnrollmentTokens(wendyauth.v1.Envelope)  returns (ListEnrollmentTokensResponse); // payload = ListEnrollmentTokensRequest
  rpc RevokeCertificate(wendyauth.v1.Envelope)     returns (RevokeCertificateResponse);// payload = RevokeCertificateRequest
  rpc RevokeEABKey(wendyauth.v1.Envelope)          returns (RevokeEABKeyResponse);     // payload = RevokeEABKeyRequest
  rpc RevokeEnrollmentToken(wendyauth.v1.Envelope) returns (RevokeEnrollmentTokenResponse); // payload = RevokeEnrollmentTokenRequest
  rpc RevokeCA(wendyauth.v1.Envelope)              returns (RevokeCAResponse);         // payload = RevokeCARequest
  rpc CreateTenant(wendyauth.v1.Envelope)          returns (CreateCustomerCAResponse); // payload = CreateCustomerCARequest (platform provisioning, no anchor at create time)
  rpc ValidateOperatorCertificate(wendyauth.v1.Envelope) returns (ValidateOperatorCertificateResponse); // payload = ValidateOperatorCertificateRequest

  // -- tier 3: signed operator request (signed_artifact "management-request+jws") --
  rpc SetTenantPolicy(wendyauth.v1.Envelope)       returns (SetTenantPolicyResponse);
  rpc OffboardTenant(wendyauth.v1.Envelope)        returns (OffboardTenantResponse);
  rpc ListCertMetadata(wendyauth.v1.Envelope)      returns (ListCertMetadataResponse);
  rpc GetAuditLog(wendyauth.v1.Envelope)           returns (stream AuditLogEntry);
  rpc RotateCA(wendyauth.v1.Envelope)              returns (RotateCAResponse);        // payload = RotateCARequest
  rpc MigrateCA(wendyauth.v1.Envelope)             returns (MigrateCAResponse);       // payload = MigrateCARequest

  // Over-duration issuance (four-eyes) over the fabric (WDY-2638). The operator
  // submits the request through cloud and collects the certificate at cloud;
  // these two are the halves that return NO certificate. Tier 3: the operator's
  // signature IS the authority — cloud only relays, and its transport identity
  // grants nothing (D7). Tenant is taken from the transport-authenticated
  // Envelope, never from the payload, the same rule NotarizePostboxHead states.
  // payload = OverDurationRequestPayload; signed_artifact =
  // {kind:"over-duration-request+jws", value:<operator JWS over the descriptor>}.
  rpc RequestOverDurationIssuance(wendyauth.v1.Envelope) returns (OverDurationRequestResponse);
  // The approval is a SEPARATE signed request, never a replay of the cert
  // request: four-eyes lives in the second operator's signature, taken over the
  // pending request's hash. payload = OverDurationApprovalPayload;
  // signed_artifact = {kind:"over-duration-approval+jws", value:<approver JWS>}.
  rpc ApproveOverDurationIssuance(wendyauth.v1.Envelope) returns (OverDurationApprovalResponse);

  rpc GetCapabilities(GetCapabilitiesRequest)      returns (GetCapabilitiesResponse);  // reuse from fabric_relay.proto
}

// ValidateOperatorCertificate (tier 1) answers, live from pki-core's own
// state: "is this leaf a currently-valid operator certificate of the envelope
// tenant?" It exists for cloud's authorization path — when cloud receives an
// operator-signed request (JWS/COSE with x5c/x5chain), it delegates the whole
// cert-validity question here instead of building X.509 paths, tracking CA
// rotations, and consuming CRL/OCSP artifacts itself. The published CRL/OCSP
// pipeline stays what it is: distribution for third-party/offline relying
// parties, never the authority's own hot path (same rationale as the engine's
// CheckOperatorAuthority — a revocation must take effect on the NEXT request,
// not at the next publish).
//
// Tier 1 is justified the same way the Revoke*/Get* family is: the caller
// already holds the certificate it is asking about, the check is single-leaf
// (no enumeration, no inventory — unlike ListCertMetadata, which stays
// tier 3), and the verdict reveals nothing about the tenant beyond the one
// artifact cloud transported. A compromised cloud gains no authority from a
// read-only validity oracle.
//
// Request/response messages and verdict semantics live in engine.proto next
// to CheckOperatorAuthority — this RPC is the fabric-facing face of the same
// engine check family, and the fabric edge relays to CAEngine's
// ValidateOperatorCertificate.

// --- Over-duration issuance over the fabric (WDY-2638) ---
//
// Neither payload carries a tenant field: the tenant comes from the
// transport-authenticated Envelope, never from the payload (D7) — the same rule
// PostboxHeadAssertion is built on. Neither carries the signed descriptor
// either; that rides in Envelope.signed_artifact and is re-verified at the edge,
// so nothing cloud can alter in the payload carries authority.

// OverDurationRequestPayload is the Envelope.payload for
// RequestOverDurationIssuance: what the engine's
// RequestOverDurationIssuanceRequest carries EXCEPT signed_request, which is the
// signed_artifact.
message OverDurationRequestPayload {
  bytes timestamp_token = 1; // DER RFC 3161 TimeStampResp over the signed request
}

// OverDurationApprovalPayload is the Envelope.payload for
// ApproveOverDurationIssuance.
message OverDurationApprovalPayload {
  string pending_request_id = 1;
  bytes  timestamp_token    = 2; // DER RFC 3161 TimeStampResp over the signed approval
}

// OverDurationRequestResponse mirrors the engine's
// RequestOverDurationIssuanceResponse MINUS certificate/chain — a tier-3
// management RPC returns no certificate. A held request is collected later over
// FabricRelayService.RelayOverDurationPickup.
message OverDurationRequestResponse {
  OverDurationOutcome outcome    = 1;
  // The handle used to collect the certificate later, via
  // FabricRelayService.RelayOverDurationPickup. Present whenever there IS
  // something to collect, WHATEVER the outcome — both when the request is held
  // for four-eyes approval (ADDITIONAL_VERIFICATION_REQUIRED) and when it was
  // within ceiling and minted immediately (MINTED), which is held for pickup
  // rather than returned here so that cloud never has to know the ceiling and
  // never branches on outcome to find its collection handle.
  //
  // Deliberately NOT named pending_request_id: for MINTED nothing is pending —
  // the certificate exists and is waiting to be fetched. Note the asymmetry
  // with OverDurationApprovalPayload.pending_request_id, which keeps that name
  // because there the request genuinely IS pending; the two carry the same
  // value at different moments in the flow.
  string collection_id           = 2;
  bytes  request_hash            = 3; // the value an approver must sign over
  string device_authorization_id = 4; // AUTHORIZATION_RECORDED only
}

// OverDurationApprovalResponse carries no certificate and no outcome enum:
// approval RECORDS an approval and mints nothing, so success is the only
// outcome and every refusal rides a gRPC status code.
message OverDurationApprovalResponse {
  string device_authorization_id = 1; // kind "device_duration" only
}
