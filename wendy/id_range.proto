syntax = "proto3";

package wendy;

// A range anchored by item IDs in the request's filter and result order.
// Start and end are independent. Unset bounds include that end of the result.
// The request's limit counts from the start of the range. See API_GUIDELINES.md
// for validation, ordering, and deleted-anchor behavior. Evolve append-only.
message IDRange {
  // Where the range starts; unset means from the first item.
  oneof start {
    // Include the item at this ID and items after it in result order.
    string from_id = 1;
    // Exclude the item at this ID; start after it in result order.
    string after_id = 2;
  }
  // Where the range ends; unset means through the last item.
  oneof end {
    // Include the item at this ID and items before it in result order.
    string through_id = 3;
    // Exclude the item at this ID; stop before it in result order.
    string up_to_id = 4;
  }
}
