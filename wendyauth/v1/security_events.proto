syntax = "proto3";
package wendyauth.v1;

import "wendyauth/v1/envelope.proto";  // Envelope, SignedArtifact

// Fail-safe / revoke-only SSF/CAEP push channel (AAA contract §6).
// Implemented by BOTH cloud and pki-core (receivers); wendy-auth is the transmitter, except
// for the x509 credential-change (certificate revoked), which pki-core transmits to cloud (WDY-3409).
// Proposed by wendy-auth (W4) — pending joint agreement with the cloud + pki-core
// receiver teams before either wires it live.
service SecurityEventService {
  // The SET rides in Envelope.signed_artifact { kind:"set+jwt", value:<compact JWS> }.
  // Receiver MUST: verify the JWS against the realm JWKS (iss->realm), enforce aud==self,
  // dedup on the SET jti, dispatch on the 'events' claim, and act REVOKE-ONLY.
  //
  // Tenant-lifecycle carve-out (event-type https://schemas.wendy.sh/secevent/tenant-deleted):
  // these SETs are realm-scoped, not principal-scoped, and MUST be signed by the `system`
  // realm (iss = .../realms/system) — the tenant realm's keys are gone post-purge, so its
  // JWKS can never resolve. Receiver MUST, for this event-type ONLY: accept iss = system
  // realm, and NOT gate on subject-realm == issuer (the sub_id tenant belongs to the
  // deleted realm, not the system issuer). The subject is the top-level
  // sub_id {format:"uri", uri:"spiffe://wendy.sh/tenant/<tenant_uuid>"}; there is no
  // per-event iss_sub subject. The binding is bidirectional: tenant-lifecycle types
  // REQUIRE iss = system (reject a tenant-realm-signed tenant-deleted), and a system
  // issuer is rejected for any non-tenant-lifecycle (principal) event. This SET alone
  // authorizes the receiver's tenant offboard — there is no operator signature in this
  // path (AAA §5.9: wendy-auth initiates, cloud/pki-core are notified-only). See
  // conformance/set/README.md. All other event-types keep the iss->realm and
  // subject-realm==issuer rules unchanged.
  //
  // Certificate revocation (WDY-3409) is CAEP credential-change with credential_type x509,
  // change_type revoke, issued by pki-core (iss = pki-core's public host per env, verified
  // against the JWKS published there), one SET per revoked serial, subject = leaf SPIFFE
  // principal in sub_id. That issuer is valid for this event only, and an x509
  // credential-change from any other issuer is rejected. See conformance/set/README.md.
  //
  // Membership refresh hint (WDY-3545, event-type
  // https://schemas.wendy.sh/secevent/membership-changed): "the membership of (realm, sub)
  // changed". Cloud only. Signed by the MEMBER'S realm and verified like any principal SET
  // (iss->realm, subject realm == issuer, never the system realm), subject = per-event
  // iss_sub. The body carries nothing beyond event_timestamp and reason_admin (audit text,
  // never dispatched on). It grants, removes and changes NOTHING by itself: the receiver
  // re-reads (tenant_uuid, sub) through AuthFabric.ListRealmMembers and converges from that
  // answer. A receiver that does not know the type acks it and ignores it.
  rpc PushSecurityEvent(Envelope) returns (PushSecurityEventAck);
}

message PushSecurityEventAck {
  string jti      = 1;  // the SET jti the receiver processed (echo, for audit correlation)
  bool   accepted = 2;  // true = processed OR already-seen (idempotent); false = rejected
}
