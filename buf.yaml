version: v2
modules:
  - path: .
lint:
  use:
    - STANDARD
  except:
    - SERVICE_SUFFIX             # service pkicore.v1.CAEngine (RPC path, cannot rename)
    - RPC_RESPONSE_STANDARD_NAME # streaming AuditLogEntry response
    - ENUM_VALUE_PREFIX          # KeyAlgorithm/AuthMode values = generated Go consts
    - ENUM_ZERO_VALUE_SUFFIX
    # pkicore.v1.FabricRelayService deliberately takes the SHARED
    # wendyauth.v1.Envelope as the request type for every relay RPC (§11.2: one
    # typed envelope carrying {tenant, correlation_id, workload_identity,
    # payload, signed_artifact} across all fabric methods, cross-checked against
    # the transport-authenticated peer). Per-RPC request messages would defeat
    # the point of a shared envelope, so these two rules cannot be satisfied
    # without abandoning the design.
    - RPC_REQUEST_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
  ignore_only:
    PACKAGE_DIRECTORY_MATCH:
      - notifications.proto # Legacy import path used by existing clients.
      - organizations.proto # Legacy import path used by existing clients.
      # Cloud's codegen passes bare basenames, and its already-generated modules
      # record `// Source: <basename>`. Moving these under wendycloud/v1/ would
      # change that generated output, so the root path is load-bearing.
      - org_invites.proto
      - telemetry_query.proto
      # Deprecated (WDY-2948); deleted outright by WDY-3423, never moved.
      - personal_access_tokens.proto
    PACKAGE_VERSION_SUFFIX:
      # Custom-option package: the option name `(wendy.signed_request)` is what
      # every annotated RPC spells, so it stays unversioned (like google.api).
      - wendy/options.proto
    FIELD_LOWER_SNAKE_CASE:
      # Inherited deviceType field spelling is a source and JSON contract.
      - wendy/agent/services/v1/wendy_agent_v1_service.proto
    PACKAGE_SAME_GO_PACKAGE:
      # Preserve producer and existing consumer Go options; consumers override mappings.
      - wendy/agent/services/v1/shared.proto
      - wendy/agent/services/v1/wendy_agent_v1_bluetooth.proto
      - wendy/agent/services/v1/wendy_agent_v1_container_service.proto
      - wendy/agent/services/v1/wendy_agent_v1_provisioning_service.proto
      - wendy/agent/services/v1/wendy_agent_v1_service.proto
      - wendy/agent/services/v1/wendy_agent_v1_shell_service.proto
      - wendy/agent/services/v1/wendy_agent_v1_telemetry_service.proto
      - wendy/agent/services/v1/wendy_agent_v1_video_service.proto
      - wendy/agent/services/v2/agent_update_service.proto
      - wendy/agent/services/v2/audio_service.proto
      - wendy/agent/services/v2/bluetooth_service.proto
      - wendy/agent/services/v2/build_service.proto
      - wendy/agent/services/v2/calibrated_frame_service.proto
      - wendy/agent/services/v2/container_service.proto
      - wendy/agent/services/v2/data_service.proto
      - wendy/agent/services/v2/device_info_service.proto
      - wendy/agent/services/v2/driver_service.proto
      - wendy/agent/services/v2/file_sync_service.proto
      - wendy/agent/services/v2/local_mesh_admin_service.proto
      - wendy/agent/services/v2/mesh_service.proto
      - wendy/agent/services/v2/os_update_service.proto
      - wendy/agent/services/v2/provisioning_service.proto
      - wendy/agent/services/v2/robot_arm_service.proto
      - wendy/agent/services/v2/ros2_service.proto
      - wendy/agent/services/v2/sensor_pairing_service.proto
      - wendy/agent/services/v2/sensor_service.proto
      - wendy/agent/services/v2/shared.proto
      - wendy/agent/services/v2/telemetry_service.proto
      - wendy/agent/services/v2/timesync_service.proto
      - wendy/agent/services/v2/tunnel_service.proto
      - wendy/agent/services/v2/unitree_robot_service.proto
      - wendy/agent/services/v2/unitree_service.proto
      - wendy/agent/services/v2/wifi_service.proto
breaking:
  use:
    - FILE
  ignore_only:
    # Approved Agent video relocation; remove once the actual default includes it.
    FIELD_SAME_NAME:
      - wendy/agent/services/v1/wendy_agent_v1_video_service.proto
    FIELD_SAME_JSON_NAME:
      - wendy/agent/services/v1/wendy_agent_v1_video_service.proto
    # WDY-3458: operator-signed RPCs now take wendycloud.v2.SignedRequest (the
    # signature moved from headers into the body). One intentional break,
    # shipped in a coordinated merge round. Drop this entry in a follow-up PR
    # once this lands on master.
    RPC_SAME_REQUEST_TYPE:
      - wendycloud/v2/apps.proto
      - wendycloud/v2/assets.proto
      - wendycloud/v2/certificates.proto
      - wendycloud/v2/deployments.proto
      - wendycloud/v2/maps.proto
      - wendycloud/v2/notifications.proto
      - wendycloud/v2/org_teams.proto
      - wendycloud/v2/organizations.proto
      - wendycloud/v2/pki_admin.proto
      - wendycloud/v2/roles.proto
    FILE_NO_DELETE:
      # Approved Agent video relocation; remove once the actual default includes it.
      - agent_video_service.proto
      # wendycloud/v2/oauth.proto: OAuthService generated client secrets it never
      # stored or verified; no caller (WDY-3365). Machine credentials are
      # wendy-auth service accounts. v1 oauth.proto stays (legacy prod contract).
      # Drop this entry once master no longer has the file.
      - wendycloud/v2/oauth.proto
