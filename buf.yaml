version: v2
modules:
  - path: .
lint:
  use:
    - STANDARD
  except:
    - SERVICE_SUFFIX             # service pkicore.v1.CAEngine (RPC path, cannot rename)
    - RPC_RESPONSE_STANDARD_NAME # streaming AuditLogEntry response
    - ENUM_VALUE_PREFIX          # KeyAlgorithm/AuthMode values = generated Go consts
    - ENUM_ZERO_VALUE_SUFFIX
    # pkicore.v1.FabricRelayService deliberately takes the SHARED
    # wendyauth.v1.Envelope as the request type for every relay RPC (§11.2: one
    # typed envelope carrying {tenant, correlation_id, workload_identity,
    # payload, signed_artifact} across all fabric methods, cross-checked against
    # the transport-authenticated peer). Per-RPC request messages would defeat
    # the point of a shared envelope, so these two rules cannot be satisfied
    # without abandoning the design.
    - RPC_REQUEST_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
  ignore_only:
    PACKAGE_DIRECTORY_MATCH:
      - notifications.proto # Legacy import path used by existing clients.
      - organizations.proto # Legacy import path used by existing clients.
      # Cloud's codegen passes bare basenames, and its already-generated modules
      # record `// Source: <basename>`. Moving these under wendycloud/v1/ would
      # change that generated output, so the root path is load-bearing.
      - org_invites.proto
      - telemetry_query.proto
      # WDY-2808 touches every root-level proto that carries an int identifier.
      # CI lints only the files a PR changes, so these paths had never been in
      # scope before and their long-standing root location surfaced as new lint
      # failures. Same reason as the four above — Cloud's codegen passes bare
      # basenames and its generated modules record `// Source: <basename>`.
      - apps.proto
      - assets.proto
      - certificates.proto
      - deployments.proto
      - hackathon_cert.proto
      - invite_links.proto
      - leaderboard.proto
      - logtailing.proto
      - maps.proto
      - oauth.proto
      - org_teams.proto
      - public_routing.proto
      - schedule.proto
      - teams.proto
      - telemetry.proto
      - tunnel.proto
breaking:
  use:
    - FILE
