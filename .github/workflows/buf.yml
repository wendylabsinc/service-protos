name: buf
on:
  pull_request:
    # `labeled` and `unlabeled` are needed for the breaking-change gate below:
    # the default trigger list does not re-run on a label change, so a label
    # applied at review time would never get a fresh run to turn green.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [master]
jobs:
  buf:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: bufbuild/buf-setup-action@v1
      - name: Lint every changed proto
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
          elif [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            base_sha="$(git rev-parse HEAD^)"
          else
            base_sha="$BEFORE_SHA"
          fi

          mapfile -t proto_files < <(
            git diff --name-only --diff-filter=ACMR "$base_sha" "$GITHUB_SHA" -- '*.proto'
          )
          if (( ${#proto_files[@]} == 0 )); then
            echo "No changed proto files to lint."
            exit 0
          fi

          lint_args=()
          for proto_file in "${proto_files[@]}"; do
            lint_args+=(--path "$proto_file")
          done
          buf lint "${lint_args[@]}"
      # Breaking-change guard for ALL cross-service protos — the drift guard,
      # caught in one place. Runs on PRs against master.
      #
      # A PR that is deliberately breaking carries the `breaking-change` label,
      # which skips this step. The gate is per-PR on purpose: a per-rule
      # `except` in buf.yaml would blind the guard permanently, for every PR.
      - name: Breaking change check (vs master)
        if: >-
          github.event_name == 'pull_request' &&
          !contains(github.event.pull_request.labels.*.name, 'breaking-change')
        run: buf breaking --against "https://github.com/wendylabsinc/service-protos.git#branch=master"
      - name: Breaking change check skipped
        if: >-
          github.event_name == 'pull_request' &&
          contains(github.event.pull_request.labels.*.name, 'breaking-change')
        run: echo "buf breaking skipped — this PR carries the 'breaking-change' label"
