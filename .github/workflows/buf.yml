name: contracts
on:
  pull_request:
  push:
    branches: [master]

jobs:
  views:
    name: contract views (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.2'
      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          version: '1.75.0'
          github_token: ${{ github.token }}
      - name: Check every view against independent baselines
        env:
          CONTRACT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/contracts.py check --base "$env:CONTRACT_BASE"
        if: runner.os == 'Windows'
      - name: Check every view against independent baselines
        env:
          CONTRACT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/contracts.py check --base "$CONTRACT_BASE"
        if: runner.os != 'Windows'
      - name: Prove compatibility enforcement
        run: python -m unittest discover -s scripts -p "test_*.py" -v
  conformance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - name: Replay existing conformance vectors
        run: |
          go run conformance/postbox/verify.go conformance/postbox
          go run conformance/postbox-entry/verify.go conformance
          go run conformance/registry/verify.go conformance
  contracts:
    if: always()
    needs: [views, conformance]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require every platform
        env:
          VIEWS: ${{ needs.views.result }}
          CONFORMANCE: ${{ needs.conformance.result }}
        run: test "$VIEWS" = success && test "$CONFORMANCE" = success
