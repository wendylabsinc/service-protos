name: buf
on:
  pull_request:
  push:
    branches: [master]
jobs:
  buf:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: bufbuild/buf-setup-action@v1
        with:
          # Without a token the action resolves its download URL over the
          # unauthenticated GitHub API and fails the whole job whenever the
          # runner's shared IP is rate-limited.
          github_token: ${{ github.token }}
      - name: Lint every changed proto
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
          elif [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            base_sha="$(git rev-parse HEAD^)"
          else
            base_sha="$BEFORE_SHA"
          fi

          mapfile -t proto_files < <(
            git diff --name-only --diff-filter=ACMR "$base_sha" "$GITHUB_SHA" -- '*.proto' ':!frozen/cloud-v1/**'
          )
          if (( ${#proto_files[@]} == 0 )); then
            echo "No changed proto files to lint."
            exit 0
          fi

          lint_args=()
          for proto_file in "${proto_files[@]}"; do
            lint_args+=(--path "$proto_file")
          done
          buf lint "${lint_args[@]}"
      - name: Check isolated frozen Cloud v1 views
        run: |
          for config in buf.cloud-v1-dashboard.yaml buf.cloud-v1-submodule.yaml; do
            buf lint --config "$config"
            # New views have no master baseline on their first introduction.
            if [[ "${{ github.event_name }}" == "pull_request" ]] && git cat-file -e "origin/master:$config" 2>/dev/null; then
              buf breaking --config "$config" --against-config "$config" \
                --against "https://github.com/wendylabsinc/service-protos.git#branch=master"
            fi
          done
      # Breaking-change guard for ALL cross-service protos — the drift guard,
      # caught in one place. Runs on PRs against master.
      - name: Breaking change check (vs master)
        if: github.event_name == 'pull_request'
        run: buf breaking --against "https://github.com/wendylabsinc/service-protos.git#branch=master"
