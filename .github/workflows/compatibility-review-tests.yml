name: Compatibility Review tests
on:
  pull_request:
permissions: {}
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s .github/compatibility-review -p 'test_*.py'
